<!DOCTYPE html>
<html lang="uk"
      layout:decorate="~{admin/blocks/layout.html}"
      xmlns:layout="http://www.w3.org/1999/xhtml"
      xmlns="http://www.w3.org/1999/html">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title th:text="#{text.order}"></title>
    <style>
        .boldMy {
            font-weight: bold;
        }
    </style>
</head>
<body>
<!-- Content -->
<div layout:fragment="content" class="container-xxl p-0">
    <div class="flex-shrink-1 flex-grow-1 container-p-x container-p-y">

        <!-- Header content -->
        <div class="row mb-4 align-items-center">
            <div class="col-12 d-flex align-items-center gap-2">
                <a th:href="@{/admin/orders}">
                    <i class="ti ti-arrow-left icon-hover-arrow" style="color: green; font-size: 30px;"></i>
                </a>
                <nav aria-label="breadcrumb">
                    <ol class="breadcrumb m-0">
                        <li class="breadcrumb-item">
                            <span class="text-muted" th:text="#{text.orders}"></span>
                        </li>
                        <li class="breadcrumb-item active fw-bold">
                            <span th:text="#{text.order} + ' № ' + ${id}"></span>
                        </li>
                    </ol>
                </nav>
            </div>
        </div>

        <div class="row g-4">
            <div class="col-12 d-flex flex-column flex-md-row justify-content-between align-items-md-center gap-3 mb-4">
                <div>
                    <h3 class="mb-0">
                        <span th:text="#{text.order} + ' № ' + ${id}"></span>
                    </h3>
                </div>

                <div style="min-width: 250px;">
                    <label class="form-label fw-bold mb-1" th:text="#{table.header.statusPayment} + ':'"></label>
                    <input id="orderStatus_" class="form-control bg-light" value="" readonly>
                </div>
            </div>

            <div class="col-12 col-lg-7 mt-4">
                <div class="table-responsive border rounded">
                    <table class="table table-hover table-striped mb-0">
                        <thead class="table-light">
                        <tr>
                            <th style="min-width: 100px">ID</th>
                            <th style="min-width: 200px" th:text="#{table.header.name}"></th>
                            <th th:text="#{table.header.totalCount}"></th>
                            <th th:text="#{table.header.price}"></th>
                            <th th:text="#{table.header.summa}"></th>
                        </tr>
                        </thead>
                        <tbody id="table-data-container_"></tbody>
                    </table>
                </div>
                <div class="d-flex justify-content-end mt-2 p-2 bg-light border rounded">
                    <span class="fw-bold" th:text="#{table.header.totalPrice}+': '"></span>
                    <span id="total-summa_" class="ms-2 fw-bold text-success"></span>
                </div>
            </div>

            <div class="col-12 border-top pt-4 mt-4">
                <label class="form-label fw-bold text-uppercase"
                       th:text="#{text.informationAboutCustomer}"></label>
                <div class="row g-3">
                    <div class="col-12 col-md-6 col-lg-3">
                        <label class="form-label small fw-bold" th:text="#{text.registrationType}+':'"></label>
                        <input id="userRegisterType_" class="form-control" readonly>
                    </div>
                    <div class="col-12 col-md-6 col-lg-3">
                        <label class="form-label small fw-bold" th:text="#{table.header.fio}+':'"></label>
                        <input id="fio_" class="form-control" readonly>
                    </div>
                    <div class="col-12 col-md-6 col-lg-3">
                        <label class="form-label small fw-bold" th:text="#{table.header.phone}+':'"></label>
                        <input id="phone_" class="form-control" readonly>
                    </div>
                    <div class="col-12 col-md-6 col-lg-3">
                        <label class="form-label small fw-bold" th:text="#{table.header.email}+':'"></label>
                        <input id="email_" class="form-control" readonly>
                    </div>
                </div>
            </div>

            <div class="col-12 border-top pt-3">
                <label class="form-label fw-bold small mb-1" th:text="#{table.header.dateOfOrdering}+':'"></label>
                <div id="dateOfOrdering_" class="form-control-plaintext py-0 px-3 border rounded bg-light"
                style="width: 10%;"></div>
            </div>

            <div class="col-12 border-top pt-4">
                <div class="row g-3">
                    <div class="col-12 col-sm-6 col-lg-3">
                        <label class="form-label fw-bold small" th:text="#{table.header.typeOfDelivery}+':'"></label>
                        <input id="deliveryType_" class="form-control" readonly>
                    </div>
                    <div class="col-12 col-sm-6 col-lg-3">
                        <label class="form-label fw-bold small" th:text="#{table.header.statusDelivery}+':'"></label>
                        <input id="deliveryStatus_" class="form-control" readonly>
                    </div>
                    <div class="col-12 col-sm-6 col-lg-3">
                        <label class="form-label fw-bold small" th:text="#{table.header.typeOfPayment}+':'"></label>
                        <input id="paymentType_" class="form-control" readonly>
                    </div>
                    <div class="col-12 col-sm-6 col-lg-3">
                        <label class="form-label fw-bold small" th:text="#{table.header.status}+':'"></label>
                        <input id="isPayed_" class="form-control" readonly>
                    </div>
                </div>
            </div>

            <div class="col-12 border-top border-bottom pb-4 pt-4 mb-4">
                <div class="row g-3" id="delivery-info-row">
                    <div class="col-12 col-md-6 col-lg-4">
                        <label class="form-label fw-bold small" th:text="#{table.header.city}+':'"></label>
                        <input id="city_" class="form-control" readonly>
                    </div>
                    <div class="col-12 col-md-6 col-lg-4">
                        <label class="form-label fw-bold small" th:text="#{table.header.address}+':'"></label>
                        <input id="addressDelivery_" class="form-control" readonly>
                    </div>
                    <div class="col-12 col-md-6 col-lg-4">
                        <label class="form-label fw-bold small" th:text="#{text.company}+':'"></label>
                        <input id="companyDelivery_" class="form-control" readonly>
                    </div>
                    <div class="col-12 col-md-6 col-lg-4">
                        <label class="form-label fw-bold small" th:text="#{text.contactPerson}+':'"></label>
                        <input id="personNameDelivery_" class="form-control" readonly>
                    </div>
                    <div class="col-12 col-md-6 col-lg-4">
                        <label class="form-label fw-bold small" th:text="#{table.header.email}+':'"></label>
                        <input id="emailDelivery_" class="form-control" readonly>
                    </div>
                    <div class="col-12 col-md-6 col-lg-4">
                        <label class="form-label fw-bold small" th:text="#{table.header.phone}+':'"></label>
                        <input id="phoneDelivery_" class="form-control" readonly>
                    </div>
                </div>
            </div>

            <div class="col-12 d-flex justify-content-center mb-5">
                <a th:href="@{/admin/orders}" class="btn btn-label-secondary d-flex align-items-center gap-2">
                    <i class="ti ti-list"></i>
                    <span th:text="#{text.backToListOfOrders}"></span>
                </a>
            </div>
        </div>
        <!--/ Header content -->
        <input id="id_" type="hidden" th:value="${id}">
        <script th:src="@{/js/pagination.js}"></script>
        <script>
            $(document).ready(function () {
                selectedLanguage();
                getData($('#id_').val());
            });

            function getData(id) {
                let currentLang = getCurrentLang();
                let request = new XMLHttpRequest();
                request.open('GET', `${contextPath}/admin/order/${id}/data?languageCode=`+currentLang);
                request.send();
                request.addEventListener('load', async function () {
                    let data = JSON.parse(request.response);
                    let count = 0;
                    data.orderDetails.forEach(item => {
                        count += item.totalSumma = item.price * item.count;
                    });
                    loadTable(data.orderDetails);
                    document.getElementById('total-summa_').textContent = count;

                    for (const key in data) {
                        if (data.hasOwnProperty(key)) {
                            let elementById = document.getElementById(`${key}_`);
                            if (elementById) {
                                if (elementById.tagName === 'INPUT' || elementById.tagName === 'TEXTAREA') {
                                    if (key === 'isPayed') {
                                        elementById.value = data[key] ? await changeLanguage('value.status.payed', getCurrentLang())
                                            : await changeLanguage('value.status.unPayed', getCurrentLang());
                                        continue;
                                    } else if (key === 'userRegisterType') {
                                        if (data[key] === 'individual') {
                                            elementById.value = await changeLanguage('value.registration-type.individual', getCurrentLang());
                                        } else if (data[key] === 'legal') {
                                            elementById.value = await changeLanguage('value.registration-type.legal', getCurrentLang());
                                        } else if (data[key] === 'fop') {
                                            elementById.value = await changeLanguage('value.registration-type.fop', getCurrentLang());
                                        }
                                        continue;
                                    } else if (key === 'orderStatus') {
                                        if (data[key] === 'inProgress') {
                                            elementById.value = await changeLanguage('value.status.inProcess', getCurrentLang());
                                        } else if (data[key] === 'new_') {
                                            elementById.value = await changeLanguage('value.status.new', getCurrentLang());
                                        } else if (data[key] === 'close') {
                                            elementById.value = await changeLanguage('value.status.close', getCurrentLang());
                                        } else if (data[key] === 'cancel') {
                                            elementById.value = await changeLanguage('value.status.cancel', getCurrentLang());
                                        }
                                        continue;
                                    } else if (key === 'paymentType') {
                                        if (data[key] === 'invoice') {
                                            elementById.value = await changeLanguage('value.status.invoice', getCurrentLang());
                                        } else if (data[key] === 'card') {
                                            elementById.value = await changeLanguage('value.status.card', getCurrentLang());
                                        } else if (data[key] === 'cash') {
                                            elementById.value = await changeLanguage('value.status.cash', getCurrentLang());
                                        }
                                        continue;
                                    } else if (key === 'deliveryStatus') {
                                        if (data[key] === 'sent') {
                                            elementById.value = await changeLanguage('value.status.await', getCurrentLang());
                                        } else if (data[key] === 'await') {
                                            elementById.value = await changeLanguage('value.status.delivered', getCurrentLang());
                                        } else if (data[key] === 'delivered') {
                                            elementById.value = await changeLanguage('value.status.returned', getCurrentLang());
                                        } else if (data[key] === 'returned') {
                                            elementById.value = await changeLanguage('value.status.sent', getCurrentLang());
                                        }
                                        continue;
                                    }
                                    else if (key === 'deliveryStatus') {
                                        if (data[key] === 'invoice') {
                                            elementById.value = await changeLanguage('value.status.invoice', getCurrentLang());
                                        } else if (data[key] === 'card') {
                                            elementById.value = await changeLanguage('value.status.card', getCurrentLang());
                                        } else if (data[key] === 'cash') {
                                            elementById.value = await changeLanguage('value.status.cash', getCurrentLang());
                                        }
                                        continue;
                                    } else if (key === 'deliveryType') {
                                        if (data[key] === 'pickUp') {
                                            elementById.value = await changeLanguage('value.status.pickUp', getCurrentLang());
                                            $('#addressDelivery_').parent().remove();
                                            $('#city_').parent().remove();
                                        } else if (data[key] === 'newMail') {
                                            elementById.value = await changeLanguage('value.status.newMail', getCurrentLang());
                                            $('#phoneDelivery_').parent().remove();
                                            $('#emailDelivery_').parent().remove();
                                            $('#personNameDelivery_').parent().remove();
                                            $('#companyDelivery_').parent().remove();
                                        } else if (data[key] === 'courier') {
                                            elementById.value = await changeLanguage('value.status.courierInOdessa', getCurrentLang());
                                            $('#companyDelivery_').parent().remove();
                                            $('#phoneDelivery_').parent().remove();
                                            $('#emailDelivery_').parent().remove();
                                            $('#personNameDelivery_').parent().remove();
                                            $('#city_').parent().remove();
                                        }
                                        continue;
                                    }
                                    elementById.value = data[key];
                                } else {
                                    elementById.textContent = data[key];
                                }
                            }
                        }
                    }
                });
            }
        </script>
    </div>
</div>
<!--/ Content -->

</body>
</html>
