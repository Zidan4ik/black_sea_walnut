<!DOCTYPE html>
<html
        lang="uk"
        layout:decorate="~{admin/blocks/layout.html}"
        xmlns:layout="http://www.w3.org/1999/xhtml"
        xmlns="http://www.w3.org/1999/html">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title th:text="#{text.sidebar.statistic}"></title>
    <link rel="stylesheet" th:href="@{/vuexy/assets/vendor/libs/apex-charts/apex-charts.css}"/>
    <link rel="stylesheet" th:href="@{/vuexy/assets/vendor/libs/bootstrap-datepicker/bootstrap-datepicker.css}"/>
    <style>
        .header-mini-table {
            color: black !important;
            background-color: lightgrey !important;
            width: auto !important;
            text-align: center;
            font-size: 0.85rem;
        }

        #scrollbar {
            -webkit-appearance: none;
            width: 100%;
            height: 8px;
            background: #dcf5dd;
            border-radius: 5px;
            outline: none;
            opacity: 0.9;
            transition: opacity .2s;
        }

        #scrollbar::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 20px;
            height: 20px;
            background: forestgreen;
            border-radius: 50%;
            cursor: pointer;
            border: 2px solid #037b55;
        }

        canvas {
            max-width: 100% !important;
            height: auto !important;
        }

        .chart-container {
            min-height: 300px;
            width: 100%;
        }
    </style>
</head>
<body>
<!-- Content -->
<div layout:fragment="content" class="container-xxl p-0">
    <div class="flex-shrink-1 flex-grow-1 container-p-x container-p-y">

        <div class="card p-4 mb-5 shadow-sm">
            <div class="row align-items-center g-3 mb-4">
                <div class="col-12 col-md-auto">
                    <h4 class="mb-0" th:text="#{text.countOrdersByMonth}"></h4>
                </div>
                <div class="col-12 col-md-4 col-lg-3">
                    <div class="input-group input-group-merge">
                        <input id="dateAmountOrdersByMonth_" type="text" class="form-control" placeholder="dd.mm.yyyy"/>
                        <span class="input-group-text cursor-pointer" onclick="focusInput('dateAmountOrdersByMonth_')">
                            <i class="ti ti-calendar"></i>
                        </span>
                    </div>
                </div>
            </div>
            <div id="chart-orders" class="chart-container"></div>
            <div id="chart-orders-noExist" class="text-center text-muted"></div>
            <input type="range" id="scrollbar" min="0" max="10" step="1" value="10" class="mt-3">
        </div>

        <div class="card p-4 mb-5 shadow-sm">
            <div class="text-center mb-4">
                <h4>
                    <span th:text="#{text.top}"></span>
                    <span id="text-amount-products_" class="badge bg-label-success">5</span>
                    <span th:text="#{text.goods}"></span>
                </h4>
            </div>

            <div class="row g-3 mb-4 justify-content-center">
                <div class="col-12 col-sm-6 col-md-4">
                    <div class="input-group input-group-merge">
                        <input id="dateAmountProducts_" type="text" class="form-control" placeholder="dd.mm.yyyy"/>
                        <span class="input-group-text cursor-pointer" onclick="focusInput('dateAmountProducts_')">
                            <i class="ti ti-calendar"></i>
                        </span>
                    </div>
                </div>
                <div class="col-12 col-sm-6 col-md-2">
                    <select class="form-select" id="size-amount-products_">
                        <option value="3">3</option>
                        <option value="5" selected>5</option>
                        <option value="7">7</option>
                        <option value="10">10</option>
                    </select>
                </div>
            </div>

            <div class="row g-4">
                <div class="col-12 col-xl-6">
                    <div class="table-responsive border rounded">
                        <table class="table table-hover mb-0">
                            <thead>
                            <tr>
                                <th class="header-mini-table">№</th>
                                <th class="header-mini-table" th:text="#{table.header.name}"></th>
                                <th class="header-mini-table" th:text="#{table.header.count}"></th>
                                <th class="header-mini-table" th:text="#{table.header.sales}"></th>
                            </tr>
                            </thead>
                            <tbody id="table-data-container_" class="text-center"></tbody>
                        </table>
                    </div>
                </div>
                <div class="col-12 col-xl-6">
                    <div id="chart-products" style="height: 365px; width: 100%;"></div>
                </div>
            </div>
        </div>

        <div class="card p-4 shadow-sm">
            <h4 class="text-center mb-4" th:text="#{text.kindOfUsers}"></h4>
            <div class="row g-4 align-items-center">
                <div class="col-12 col-md-4 offset-md-1">
                    <div class="input-group input-group-merge">
                        <input id="dateAmountUsers_" type="text" class="form-control" placeholder="dd.mm.yyyy"/>
                        <span class="input-group-text cursor-pointer" onclick="focusInput('dateAmountUsers_')">
                            <i class="ti ti-calendar"></i>
                        </span>
                    </div>
                </div>
                <div class="col-12 col-md-6 d-flex justify-content-center">
                    <div id="chart-users" style="min-height: 300px; width: 100%;"></div>
                </div>
            </div>
        </div>
    </div>

    <input type="hidden" name="languageCode" value="uk" id="languageCode_">
    <script th:src="@{/vuexy/assets/vendor/libs/apex-charts/apexcharts.js}"></script>
    <script src="https://cdn.canvasjs.com/jquery.canvasjs.min.js"></script>
    <script th:src="@{/js/pagination.js}"></script>

    <script>
        let timeoutId;
        $(document).ready(function () {
            selectedLanguage();
            $(`#dateAmountOrdersByMonth_`).datepicker({
                format: "dd.mm.yyyy",
                autoclose: true
            }).datepicker("setDate", new Date());

            $(`#dateAmountProducts_`).datepicker({
                format: "dd.mm.yyyy",
                autoclose: true
            }).datepicker("setDate", new Date());

            $(`#dateAmountUsers_`).datepicker({
                format: "dd.mm.yyyy",
                autoclose: true
            }).datepicker("setDate", new Date());

            addListeners();
        });

        window.addEventListener('load', function () {
            let dateNow = new Date().toLocaleDateString('uk-UA');
            let size = $('#size-amount-products_').val();

            invokeBlockUI();
            Promise.all([
                requestGetUsersByDate(dateNow),
                requestByDateOrder(dateNow),
                requestGetProducts(size, dateNow)
            ])
                .then(() => {
                    console.log("Всі дані завантажено успішно");
                }).catch(err => {
                console.error("Один із запитів завершився помилкою", err);
            }).finally(() => {
                setTimeout(() => $('#card-block').unblock(), 1000);
            });
        });

        function addListeners() {
            $(`#dateAmountProducts_`).on('change', function () {
                let size = $('#size-amount-products_').val();
                requestGetProducts(size, this.value);
            });

            $('#size-amount-products_').on('change', function () {
                let size = this.value;
                let date = $(`#dateAmountProducts_`).val();
                $('#text-amount-products_').text(size);
                requestGetProducts(size, date);
            });

            $('#dateAmountOrdersByMonth_').on('change', function () {
                requestByDateOrder(this.value);
            });

            $('#dateAmountUsers_').on('change', function () {
                requestGetUsersByDate(this.value);
            });
        }

        function requestByDateOrder(date) {
            return $.ajax({
                url: `${contextPath}/admin/orders/getByDate`,
                type: 'GET',
                data: {date: date},
                dataType: 'json'
            }).done(function (data) {
                const noExistContainer = $("#chart-orders-noExist");
                const scrollbar = $('#scrollbar');

                if (!data || data.length === 0) {

                    noExistContainer.html(`<h5>${messages.dataTableNoExist}</h5>`);
                    scrollbar.css('display', 'none');

                    let chartElement = document.querySelector("#chart-orders");
                    if (chartElement && chartElement.chart) {
                        chartElement.chart.destroy();
                        chartElement.chart = null;
                    }
                } else {
                    let outputData = data.map(item => [item.date, item.count]);

                    scrollbar.css('display', outputData.length <= 7 ? 'none' : 'flex');

                    loadChartOrders(outputData);
                    noExistContainer.html('');
                }
            }).fail(function (xhr) {
                console.error("Помилка завантаження замовлень:", xhr.status);
            });
        }


        function requestGetUsersByDate(data) {
            return $.ajax({
                url: contextPath + `/admin/stats/users/get?date=${data}`,
                data: {data: data}
            }).then(data => {
                if (!data || data.length === 0) {
                    const noExistText = getCurrentLang() === 'uk' ? 'Дані відсутні' : 'No data';
                    $("#chart-users").html(`<h5>${noExistText}</h5>`);
                } else {
                    let labels = data.map(item => returnUserStatus2(item.status));
                    let count = data.map(item => item.count);
                    loadChartUsers(labels, count);
                }
            });
        }

        function requestGetProducts(size, date) {
            return $.ajax({
                url: `${contextPath}/admin/stats/products/get`,
                type: 'GET',
                data: {date: date, size: size},
                dataType: 'json'
            }).done(function (data) {
                console.log(data);

                let arrayUnderLang = data.map(item => ({
                    article: item.article,
                    name: getCurrentLang() === 'uk' ? item.nameUk : item.nameEn,
                    count: item.count,
                    summa: item.summa
                }));

                let chartArray = arrayUnderLang.map(item => ({
                    y: parseInt(item.count) || 0,
                    label: item.name
                }));

                if (data.length > 0) loadChartProducts(chartArray);

                clearTimeout(timeoutId);
                timeoutId = setTimeout(() => {
                    loadTable(arrayUnderLang);
                }, 1000);
            }).fail(function (xhr) {
                console.error("Помилка завантаження продуктів:", xhr.status);
            });
        }

        function returnUserStatus2(status) {
            let currentLang = $('#languageCode_').val();
            if (status === 'legal') {
                if (currentLang === 'uk') {
                    return 'Юридичне обличчя';
                } else if (currentLang === 'en') {
                    return 'Legal';
                }
            } else if (status === 'fop') {
                if (currentLang === 'uk') {
                    return 'Фоп';
                } else if (currentLang === 'en') {
                    return 'Fop';
                }
            } else if (status === 'individual') {
                if (currentLang === 'uk') {
                    return 'Фізичне обличчя';
                } else if (currentLang === 'en') {
                    return 'Individual';
                }
            }
        }
    </script>

    <script>
        function loadChartOrders(data) {
            let element = document.querySelector("#chart-orders");

            if (element.chart) {
                element.chart.destroy();
                element.chart = null;
            }
            element.innerHTML = '';

            let isDark = (typeof current_mode !== 'undefined' && current_mode === 'dark');
            let textColor = isDark ? '#FFFFFF' : '#000000';

            var visiblePoints = 7;
            var startIndex = 0;

            var options = {
                series: [{
                    name: 'Orders',
                    type: 'area',
                    data: data.slice(startIndex)
                }],
                chart: {
                    height: 300,
                    type: 'area',
                    foreColor: textColor,
                    toolbar: {show: true},
                    zoom: {enabled: true},
                    animations: {enabled: false}
                },
                colors: ['#037b55'],
                stroke: {
                    curve: 'smooth',
                    width: 3,
                    colors: ['#347b3e']
                },
                fill: {
                    type: 'gradient',
                    gradient: {
                        shadeIntensity: 1,
                        opacityFrom: 0.6,
                        opacityTo: 0.1,
                        colorStops: [
                            {offset: 0, color: "#77ff33", opacity: 0.7},
                            {offset: 100, color: "#0c9068", opacity: 0.1}
                        ]
                    }
                },
                markers: {
                    size: 5,
                    colors: ['#54a455'],
                    strokeColors: isDark ? '#2F3349' : '#FFFFFF',
                    strokeWidth: 2
                },
                tooltip: {
                    theme: isDark ? 'dark' : 'light',
                    x: {format: 'dd MMM yyyy'}
                },
                yaxis: [{
                    title: {
                        text: messages.amountOrders,
                        style: {
                            color: textColor,
                            fontWeight: 400
                        }
                    },
                    labels: {
                        style: {
                            colors: textColor,
                            fontWeight: 400
                        }
                    }
                }],
                xaxis: {
                    type: 'datetime',
                    labels: {
                        format: 'dd MMM',
                        style: {colors: textColor}
                    },
                    axisBorder: {show: true, color: isDark ? '#444' : '#ccc'},
                    axisTicks: {show: true, color: isDark ? '#444' : '#ccc'}
                },
                grid: {
                    borderColor: isDark ? '#444' : '#eee',
                }
            };

            let chart = new ApexCharts(element, options);
            chart.render();

            element.chart = chart;

            var scrollbar = document.getElementById("scrollbar");
            scrollbar.max = data.length > visiblePoints ? data.length - visiblePoints : 0;
            scrollbar.value = startIndex;

            const newScrollbar = scrollbar.cloneNode(true);
            scrollbar.parentNode.replaceChild(newScrollbar, scrollbar);

            newScrollbar.addEventListener("input", function () {
                var newIndex = parseInt(this.value);
                chart.updateSeries([{
                    name: 'Orders',
                    data: data.slice(newIndex, newIndex + visiblePoints)
                }], false);
            });
        }

        function loadChartProducts(data) {
            let isDark = (typeof current_mode !== 'undefined' && current_mode === 'dark');
            let textColor = isDark ? "#FFFFFF" : "#000000";
            let tooltipBg = isDark ? "#2F3349" : "#FFFFFF";

            var options = {
                animationEnabled: true,
                backgroundColor: "transparent",
                height: 365,
                theme: isDark ? "theme2" : "theme1",

                toolTip: {
                    fontColor: textColor,
                    backgroundColor: tooltipBg,
                    borderColor: isDark ? "#444" : "#ccc",
                    cornerRadius: 5
                },

                data: [{
                    type: "funnel",
                    indexLabel: "",
                    indexLabelLineThickness: 0,
                    indexLabelFontColor: textColor,

                    toolTipContent: "<b>{label}</b>: {y} <b>({percentage}%)</b>",
                    valueRepresents: "height",
                    neckWidth: 20,
                    neckHeight: 0,
                    dataPoints: data
                }]
            };

            calculatePercentage(options);
            $("#chart-products").CanvasJSChart(options);
        }

        function loadChartUsers(labels, count) {
            $("#chart-users").empty();

            let isDark = (typeof current_mode !== 'undefined' && current_mode === 'dark');
            let textColor = isDark ? '#FFFFFF' : '#000000';

            var options = {
                series: count,
                chart: {
                    type: 'pie',
                    height: 350,
                    foreColor: textColor
                },
                labels: labels,
                legend: {
                    position: 'bottom',
                    labels: {
                        colors: textColor
                    }
                },
                stroke: {
                    show: true,
                    colors: isDark ? ['#2F3349'] : ['#FFFFFF']
                },
                dataLabels: {
                    style: {
                        colors: ['#FFFFFF'],
                        textAnchor: 'middle'
                    },
                    dropShadow: {enabled: false}
                },
                responsive: [{
                    breakpoint: 480,
                    options: {
                        chart: {width: '100%'},
                        legend: {position: 'bottom'}
                    }
                }]
            };

            var chart = new ApexCharts(document.querySelector("#chart-users"), options);
            chart.render();
        }

        function calculatePercentage(options) {
            const dataPoint = options.data[0].dataPoints;
            const total = dataPoint.reduce((sum, item) => sum + item.y, 0);

            for (let i = 0; i < dataPoint.length; i++) {
                options.data[0].dataPoints[i].percentage = ((dataPoint[i].y / total) * 100).toFixed(2);
            }
        }
    </script>
</div>
<!--/ Content -->
</body>
</html>
