<!DOCTYPE html>
<html lang="uk"
      layout:decorate="~{admin/blocks/layout.html}"
      xmlns:layout="http://www.w3.org/1999/xhtml"
      xmlns="http://www.w3.org/1999/html">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title th:text="#{text.products}"></title>

    <script th:src="@{/js/tailwind.js}"></script>
    <script th:src="@{/js/lucide.js}"></script>
</head>
<body>
<!-- Content -->
<div layout:fragment="content" class="container-xxl p-0">
    <div class="flex-shrink-1 flex-grow-1 container-p-x container-p-y">
        <h4 id="title-table" class="text-center fw-bold" th:text="#{text.table.products}"></h4>
        <div class="card w-100" id="card-block">
            <h5 class="card-header text-center text-md-start" th:text="#{text.products}"></h5>
            <div class="card-body">
                <div class="row mb-3 align-items-center">
                    <div class="col-12 col-md-6 d-flex justify-content-center justify-content-md-start mb-3 mb-md-0">
                        <div class="d-flex align-items-center">
                            <label for="pick-size-for-pagination_" class="d-flex align-items-center"><span
                                    th:text="#{text.show}"></span>
                                <select class="form-select mx-2 select-card-block-spinner"
                                        id="pick-size-for-pagination_"
                                        name="size">
                                    <option value="1">1</option>
                                    <option value="3">3</option>
                                    <option value="5" selected>5</option>
                                    <option value="15">15</option>
                                    <option value="20">20</option>
                                </select> <span th:text="#{text.export}"></span></label>
                        </div>
                    </div>
                    <div class="col-12 col-md-6">
                        <div class="d-flex justify-content-center justify-content-md-end align-items-center">
                            <div class="relative inline-block text-left">

                                <button id="exportButton"
                                        class="inline-flex items-center justify-center gap-2 px-4 py-2.5 bg-transparent hover:bg-emerald-50/80 text-emerald-700 font-semibold text-sm rounded-xl transition-all duration-200 border border-transparent active:scale-95 focus:outline-none hover:shadow-sm">
                                    <i data-lucide="file-output"
                                       class="w-4 h-4 text-emerald-600 transition-colors duration-200"></i>
                                    <span th:text="#{text.export}">Export</span>
                                    <i data-lucide="chevron-down"
                                       class="w-4 h-4 transition-transform duration-200 text-emerald-600"
                                       id="arrowIcon"></i>
                                </button>

                                <div id="dropdownMenu"
                                     class="hidden absolute left-0 mt-2 w-48 bg-white border border-gray-100 rounded-2xl shadow-xl transform opacity-0 scale-95 transition-all duration-200 origin-top-left z-50">
                                    <div class="p-1.5 space-y-0.5">

                                        <!-- Друк -->
                                        <button id="export-print"
                                                class="flex items-center gap-3 w-full px-3 py-2.5 text-sm text-gray-700 hover:bg-emerald-50 rounded-xl transition-all duration-150 text-left group">
                                            <i data-lucide="printer"
                                               class="w-4 h-4 text-gray-400 group-hover:text-emerald-600 transition-colors"></i>
                                            <span class="font-medium text-gray-600 group-hover:text-emerald-700 transition-colors"
                                                  th:text="#{text.print}"></span>
                                        </button>

                                        <!-- Csv -->
                                        <button id="export-csv"
                                                class="flex items-center gap-3 w-full px-3 py-2.5 text-sm text-gray-700 hover:bg-emerald-50 rounded-xl transition-all duration-150 text-left group">
                                            <i data-lucide="file-text"
                                               class="w-4 h-4 text-gray-400 group-hover:text-emerald-600 transition-colors"></i>
                                            <span class="font-medium text-gray-600 group-hover:text-emerald-700 transition-colors">Csv</span>
                                        </button>

                                        <button id="export-excel"
                                                class="flex items-center gap-3 w-full px-3 py-2.5 text-sm text-gray-700 hover:bg-emerald-50 rounded-xl transition-all duration-150 text-left group">
                                            <i data-lucide="upload-cloud"
                                               class="w-4 h-4 text-gray-400 group-hover:text-emerald-600 transition-colors"></i>
                                            <span class="font-medium text-gray-600 group-hover:text-emerald-700 transition-colors">Excel</span>
                                        </button>

                                        <button id="export-pdf"
                                                onclick="exportTableData(['id', 'name', 'taste', 'totalCount', 'priceByUnit', 'discount'], 'pdf')"
                                                class="flex items-center gap-3 w-full px-3 py-2.5 text-sm text-gray-700 hover:bg-emerald-50 rounded-xl transition-all duration-150 text-left group">
                                            <i data-lucide="file-spreadsheet"
                                               class="w-4 h-4 text-gray-400 group-hover:text-emerald-600 transition-colors"></i>
                                            <span class="font-medium text-gray-600 group-hover:text-emerald-700 transition-colors">Pdf</span>
                                        </button>

                                        <button id="export-copy"
                                                class="flex items-center gap-3 w-full px-3 py-2.5 text-sm text-gray-700 hover:bg-emerald-50 rounded-xl transition-all duration-150 text-left group">
                                            <i data-lucide="copy"
                                               class="w-4 h-4 text-gray-400 group-hover:text-emerald-600 transition-colors"></i>
                                            <span class="font-medium text-gray-600 group-hover:text-emerald-700 transition-colors"
                                                  th:text="#{text.copy}"></span>
                                        </button>

                                    </div>
                                </div>

                            </div>

                            <a th:href="@{/admin/product/create}" class="btn btn-green btn-icon rounded-pill me-2">
                                <i class="ti ti-plus"></i>
                            </a>
                            <span class="fw-bold label-add" style="font-size: large;"
                                  th:text="#{text.button.add}"></span>
                        </div>
                    </div>
                </div>
                <div id="error-container"></div>
                <div class="table-responsive text-nowrap">
                    <table class="table table-bordered table-hover linkedRow table-sm"
                           id="table-data-container_">
                        <thead>
                        <tr>
                            <th style="min-width: 100px">ID</th>
                            <th style="min-width: 200px" th:text="#{table.header.name}">Name</th>
                            <th style="min-width: 200px" th:text="#{table.header.taste}">Taste</th>
                            <th style="min-width: 200px" th:text="#{table.header.totalCount}">Total counts</th>
                            <th style="min-width: 200px" th:text="#{table.header.priceByProduct}">Price by product</th>
                            <th style="min-width: 200px" th:text="#{table.header.status}">Status</th>
                            <th style="min-width: 200px" th:text="#{table.header.functions}">Action</th>
                        </tr>
                        <tr>
                            <th>
                                <input class="form-control input-card-block-spinner"
                                       name="id"/>
                            </th>
                            <th>
                                <input class="form-control input-card-block-spinner"
                                       name="name"/>
                            </th>
                            <th>
                                <select class="form-select mx-2 select-card-block-spinner"
                                        id="pick-type-of-taste_"
                                        name="taste">
                                    <option value="" selected th:text="#{value.status.all}"></option>
                                </select>
                            </th>
                            <th></th>
                            <th>
                                <input class="form-control input-card-block-spinner"
                                       name="priceByUnit"/>
                            </th>
                            <th>
                                <select class="form-select mx-2 select-card-block-spinner"
                                        id="pick-type-of-discount_"
                                        name="discount">
                                    <option value="" selected th:text="#{value.status.all}"></option>
                                </select>
                            </th>
                            <th></th>
                        </tr>
                        </thead>
                    </table>
                </div>
                <div class="p-2 d-flex justify-content-center justify-content-md-end"
                     id="table-pagination-container_"></div>
                <input type="hidden" name="languageCode" id="languageCode_" value="uk">
            </div>
        </div>
    </div>
    <script th:src="@{/js/table.js}"></script>
    <script>
        const inputs = ['id', 'name', 'taste', 'priceByUnit', 'discount'];
        let pathToTable = `${contextPath}/admin/products/table/load`;
        let pathToPagination = `${contextPath}/admin/products/pagination/load`;
        let timeoutId;
        let hasExecuted = false;

        $(document).on('click', '.edit-icon', function () {
            let id = $(this).data('id');
            window.location.pathname = contextPath + `/admin/product/${id}/edit`;
        });

        $(document).on('click', '#export-excel', function () {
            let currentLang = getCurrentLang();
            if (!currentLang) currentLang = 'uk';
            window.location.href =
                `${contextPath}/admin/products/export/excel?lang=` + currentLang.toLowerCase();
        });

        $(document).on('click', '#export-pdf', function () {
            let currentLang = getCurrentLang();
            if (!currentLang) currentLang = 'uk';
            window.location.href =
                `${contextPath}/admin/products/export/pdf?lang=` + currentLang.toLowerCase();
        });

        $(document).on('click', '.delete-icon', function () {
            let id = $(this).data('id');
            confirmAndPathDelete(id, `${contextPath}/admin/product/${id}/delete`, () => {
                invokeRequest(inputs, 0, true)
            });
        });

        $(document).on('htmx:afterSwap', (event) => {
            if (event.target.id === 'table-data-container_' && !hasExecuted) {
                hasExecuted = true;
                let discounts = $("#discounts_").val();
                let tastes = $("#tastes_").val();
                discounts = discounts.split(", ").map(item => item.trim());
                tastes = tastes.split(", ").map(item => item.trim());
                let tastesNew = getTransferData(tastes);
                let discountsNew = getTransferData(discounts);
                let tastesElements = document.getElementById("pick-type-of-taste_");
                let discountElements = document.getElementById("pick-type-of-discount_");
                fillOptions(tastesElements, tastesNew);
                fillOptions(discountElements, discountsNew);
            }
        });

        function fillOptions(discountElement, tastesNew) {
            if (discountElement) {
                tastesNew.forEach((el) => {
                    let optionElement = document.createElement("option");
                    optionElement.value = el.value;
                    optionElement.textContent = el.text;
                    discountElement.append(optionElement);
                });
            }
        }

        function getTransferData(data) {
            let arr = [];
            if (Array.isArray(data)) {
                data.forEach((el) => {
                    if (typeof el === "string") {
                        let s = el.charAt(0).toUpperCase() + el.slice(1);
                        arr.push({value: el, text: s})
                    }
                });
            }
            return arr;
        }

        $(document).ready(function () {
            selectedLanguage();
        });
    </script>

    <script>
        lucide.createIcons();

        const button = document.getElementById('exportButton');
        const menu = document.getElementById('dropdownMenu');
        const arrow = document.getElementById('arrowIcon');

        let isOpen = false;

        function toggleDropdown() {
            isOpen = !isOpen;

            if (isOpen) {
                menu.classList.remove('hidden');
                setTimeout(() => {
                    menu.classList.remove('opacity-0', 'scale-95');
                    menu.classList.add('opacity-100', 'scale-100');
                    arrow.classList.add('rotate-180');
                }, 10);
            } else {
                menu.classList.remove('opacity-100', 'scale-100');
                menu.classList.add('opacity-0', 'scale-95');
                arrow.classList.remove('rotate-180');

                setTimeout(() => {
                    if (!isOpen) menu.classList.add('hidden');
                }, 200);
            }
        }

        button.addEventListener('click', (e) => {
            e.stopPropagation();
            toggleDropdown();
        });

        document.addEventListener('click', (e) => {
            if (isOpen && !button.contains(e.target) && !menu.contains(e.target)) {
                toggleDropdown();
            }
        });

        $(document).on("click", "#export-print", function () {

            let $table = $("#table-data-container_").clone();
            const $title_table = $("#title-table").text();
            $table.find("thead tr:eq(1)").remove();

            $table.find("tr").each(function () {
                $(this).find("th:last-child, td:last-child").remove();
            });

            $table.removeClass("table-sm");
            $table.removeClass("linkedRow");

            let printWin = window.open("", "_blank");

            printWin.document.open();

            printWin.document.write(`
<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>${$title_table}</title>

<style>

@page{
    size: A4 landscape;
    margin:15mm;
}

html,
body{
    margin:0;
    padding:20px;
    font-family:Arial,Helvetica,sans-serif;
    font-size:16px;
    color:#000;
}

h2{
    text-align:center;
    margin-bottom:20px;
    font-size:24px;
}

table{
    width:100%;
    border-collapse:collapse;
    table-layout:auto;
}

table,
th,
td{
    border:1px solid #000;
}

th,
td{
    padding:10px;
    font-size:16px !important;
    line-height:1.4;
    white-space:nowrap;
}

th{
    background:#f2f2f2 !important;
    font-weight:bold;
    text-align:left;
    -webkit-print-color-adjust:exact;
    print-color-adjust:exact;
}

tbody tr:nth-child(even){
    background:#fafafa;
}

.table,
.table *{
    font-size:16px !important;
}

</style>

</head>

<body>

<h2>${$title_table}</h2>

${$table.prop("outerHTML")}

</body>
</html>
`);

            printWin.document.close();

            printWin.onload = function () {
                printWin.focus();
                printWin.print();

                printWin.onafterprint = function () {
                    printWin.close();
                };
            };

        });
    </script>

    <script>
        $(document).on('click', '#export-copy', function () {
            const headers = ["ID", "Name", "Taste", "Total counts", "Price by product"];
            let textToCopy = headers.join("\t") + "\n";

            let rows = $('#table-data-container_ tbody tr');

            if (rows.length === 0 || (rows.length === 1 && $(rows[0]).text().trim() === "")) {
                invokeCustomAlertError(messages.dataTableNoExist);
                return;
            }

            rows.each(function () {
                let cells = $(this).find('td');
                if (cells.length > 0) {
                    let id = $(cells[0]).text().trim();
                    let name = $(cells[1]).text().trim();
                    let taste = $(cells[2]).text().trim();
                    let count = $(cells[3]).text().trim();
                    let price = $(cells[4]).text().trim();

                    textToCopy += `${id}\t${name}\t${taste}\t${count}\t${price}\n`;
                }
            });

            navigator.clipboard.writeText(textToCopy)
                .then(() => {
                    invokeCustomAlertCopy()
                })
                .catch(err => {
                    console.error("Не вдалося скопіювати: ", err);
                    invokeCustomAlertError();
                });
        });

        $(document).on('click', '#export-csv', function () {
            let currentLang = getCurrentLang();
            let $page = $('#table-pagination-container_ .page-item.active a').data('page');
            if (!currentLang) currentLang = 'uk';

            let params = new URLSearchParams();
            for (const name of inputs) {
                const input = document.querySelector(`[name=${name}]`);
                if (input) params.append(name, input.value);
            }
            params.append('lang',currentLang.toLowerCase());
            params.append('page',$page);
            console.log(params);

            window.location.href =
                `${contextPath}/admin/products/export/csv?${params.toString()}`;
        });
    </script>
</div>
<!--/ Content -->
</body>
</html>
