<!DOCTYPE html>
<html lang="uk"
      layout:decorate="~{admin/blocks/layout.html}"
      xmlns:layout="http://www.w3.org/1999/xhtml"
      xmlns="http://www.w3.org/1999/html">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title th:text="#{table.header.product}"></title>
</head>
<body>
<!-- Content -->
<div layout:fragment="content" class="container-xxl p-0">
    <div class="flex-shrink-1 flex-grow-1 container-p-x container-p-y">
        <!-- Header content -->
        <div class="row mb-4">
            <div class="col-12 d-flex align-items-center flex-wrap gap-2 justify-content-start">
                <a th:href="@{/admin/products}">
                    <i class="ti ti-arrow-left icon-hover-arrow" style="color: green; font-size: 30px;"></i>
                </a>
                <span class="text-muted" th:text="#{text.table}"></span>
                <i class="ti ti-arrow-right text-muted" style="font-size: 14px;"></i>
                <span class="fw-bold" th:text="#{text.addProduct}"></span>
            </div>
        </div>
        <!--/ Header content -->

        <!-- Language Tabs -->
        <div class="nav-align-top mb-4">
            <ul class="nav nav-tabs" role="tablist" style="background: none;">
                <li class="nav-item">
                    <button type="button" class="nav-link active" data-bs-toggle="tab"
                            data-bs-target="#navs-uk" aria-controls="navs-uk" aria-selected="true"
                            data-lang="uk">
                        <i class="ti ti-planet me-1"></i><span>UK</span>
                    </button>
                </li>
                <li class="nav-item">
                    <button type="button" class="nav-link" data-bs-toggle="tab"
                            data-bs-target="#navs-en" aria-controls="navs-en" aria-selected="false"
                            data-lang="en">
                        <i class="ti ti-planet me-1"></i><span>EN</span>
                    </button>
                </li>
            </ul>
        </div>
        <!--/ Language Tabs -->

        <form id="form">
            <div class="tab-content" id="pills-tabContent">
                <!-- UK TAB -->
                <div class="tab-pane fade show active" id="navs-uk" role="tabpanel">
                    <div class="row g-4">
                        <div class="col-12 d-flex align-items-center flex-wrap gap-3 mb-2">
                            <h4 data-name="name-product" class="mb-0"></h4>
                            <div class="d-flex align-items-center">
                                <label class="switch switch-success">
                                    <input data-name="status" type="checkbox" class="switch-input"/>
                                    <span class="switch-toggle-slider">
                        <span class="switch-on"></span>
                        <span class="switch-off"></span>
                    </span>
                                </label>
                            </div>
                        </div>

                        <div class="col-12 d-flex flex-wrap align-items-center gap-3 mb-2">
                            <div class="d-flex align-items-center gap-2 flex-grow-1 flex-md-grow-0">
                                <label class="form-label mb-0 text-nowrap">Артикул: </label>
                                <div class="input-group input-group-merge" style="min-width: 150px;">
                                    <input class="form-control" data-name="articleId" placeholder="">
                                    <span class="input-group-text"><i class="ti ti-edit"></i></span>
                                </div>
                            </div>
                            <div class="d-flex align-items-center gap-2 error-message-server">
                                <label class="form-label mb-0" for="amount_uk">Кількість: </label>
                                <div class="d-flex align-items-center amount-block">
                                    <i class="ti ti-chevron-left icon-hover-arrow ms-2" data-name="arrow-left"></i>
                                    <input class="form-control text-center errorMy" id="amount_uk" data-name="amount"
                                           style="width: 45px; background: transparent;" value="1">
                                    <i class="ti ti-chevron-right icon-hover-arrow ms-2" data-name="arrow-right"></i>
                                </div>
                            </div>
                        </div>

                        <div id="image-block-uk" class="col-12 col-lg-5 text-center"></div>

                        <div class="col-12 col-lg-7">
                            <div class="row g-3">
                                <div class="col-12 col-md-6">
                                    <label for="name-uk_" class="form-label fw-bold">Назва:</label>
                                    <input class="form-control" id="name-uk_" type="text" data-name="nameUk" data-sync="name">
                                </div>
                                <div class="col-12 col-md-6">
                                    <label for="tastes-uk_" class="form-label fw-bold">Смак:</label>
                                    <select class="form-select select-card-block-spinner" id="tastes-uk_">
                                        <option value="" selected></option>
                                    </select>
                                </div>
                                <div class="col-6">
                                    <label class="form-label fw-bold">Енергетична маса, Ккал:</label>
                                    <input class="form-control" data-name="energyMass" type="text">
                                </div>
                                <div class="col-6">
                                    <label class="form-label fw-bold">Маса, Ккал:</label>
                                    <input class="form-control" data-name="mass" type="text">
                                </div>
                                <div class="col-6">
                                    <label class="form-label fw-bold">Поточна ціна:</label>
                                    <input class="form-control bg-light" data-name="oldPrice" type="text" disabled/>
                                </div>
                                <div class="col-6">
                                    <label class="form-label fw-bold">Нова ціна:</label>
                                    <input class="form-control" data-name="newPrice" type="text">
                                </div>
                                <div class="col-12 col-md-6">
                                    <label for="discounts-uk_" class="form-label fw-bold">Статус знижки:</label>
                                    <select class="form-select" id="discounts-uk_">
                                        <option value="" selected></option>
                                    </select>
                                </div>

                                <div class="row g-3">
                                    <div class="col-12 col-md-6">
                                        <label for="recipe-uk_" class="form-label fw-bold">Рецепт:</label>
                                        <textarea class="form-control" id="recipe-uk_" data-name="recipeUk" rows="3"></textarea>
                                    </div>
                                    <div class="col-12 col-md-6">
                                        <label for="condition-exploitation-uk_" class="form-label fw-bold">Спосіб зберігання:</label>
                                        <textarea class="form-control" id="condition-exploitation-uk_" data-name="conditionExploitationUk" rows="3"></textarea>
                                    </div>
                                </div>
                            </div>
                        </div>

                        <div class="col-12 border-bottom pb-4">
                            <div class="row g-3 align-items-center">
                                <div id="image-block-product-uk" class="col-12 col-lg-5 text-center"></div>
                                <div class="col-12 col-lg-7">
                                    <label for="edit-description-product-uk" class="form-label fw-bold">Продукт:</label>
                                    <div id="edit-description-product-uk" class="w-100" style="min-height: 100px; border: 1px solid #ccc;"></div>
                                    <label class="form-label small text-muted">Максимум: 2000 символів</label>
                                    <div id="hidden-edit-description-product-uk" data-name="descriptionProductUk" style="display: none;"></div>
                                </div>
                            </div>
                        </div>

                        <div class="col-12 border-bottom pb-4">
                            <div class="row g-3 align-items-center">
                                <div id="image-block-payment-uk" class="col-12 col-lg-5 text-center"></div>
                                <div class="col-12 col-lg-7">
                                    <label for="edit-description-payment-uk" class="form-label fw-bold">Платіж:</label>
                                    <div id="edit-description-payment-uk" class="w-100" style="min-height: 100px; border: 1px solid #ccc;"></div>
                                    <label class="form-label small text-muted">Максимум: 2000 символів</label>
                                    <div id="hidden-edit-description-payment-uk" data-name="descriptionPaymentUk" style="display: none;"></div>
                                </div>
                            </div>
                        </div>

                        <div class="col-12 border-bottom pb-4">
                            <div class="row g-3 align-items-center">
                                <div id="image-block-packing-uk" class="col-12 col-lg-5 text-center"></div>
                                <div class="col-12 col-lg-7">
                                    <label for="edit-description-packing-uk" class="form-label fw-bold">Пакування:</label>
                                    <div id="edit-description-packing-uk" class="w-100" style="min-height: 100px; border: 1px solid #ccc;"></div>
                                    <label class="form-label small text-muted">Максимум: 2000 символів</label>
                                    <div id="hidden-edit-description-packing-uk" data-name="descriptionPackingUk" style="display: none;"></div>
                                </div>
                            </div>
                        </div>

                        <div class="col-12 mb-4">
                            <div class="row g-3 align-items-center">
                                <div id="image-block-delivery-uk" class="col-12 col-lg-5 text-center"></div>
                                <div class="col-12 col-lg-7">
                                    <label for="edit-description-delivery-uk" class="form-label fw-bold">Доставка:</label>
                                    <div id="edit-description-delivery-uk" class="w-100" style="min-height: 100px; border: 1px solid #ccc;"></div>
                                    <label class="form-label small text-muted">Максимум: 2000 символів</label>
                                    <div id="hidden-edit-description-delivery-uk" data-name="descriptionDeliveryUk" style="display: none;"></div>
                                </div>
                            </div>
                        </div>

                        <div id="save-block-uk" class="col-12 text-center mb-3"></div>
                    </div>
                </div>
                <!--/ UK TAB -->

                <!-- EN TAB -->
                <div class="tab-pane fade mb-5" id="navs-en" role="tabpanel">
                    <div class="row g-4">
                        <div class="col-12 d-flex align-items-center flex-wrap gap-3 mb-2">
                            <h4 data-name="name-product" class="mb-0"></h4>
                            <div class="d-flex align-items-center">
                                <label class="switch switch-success">
                                    <input data-name="status" type="checkbox" class="switch-input"/>
                                    <span class="switch-toggle-slider">
                                        <span class="switch-on"></span>
                                        <span class="switch-off"></span>
                                    </span>
                                </label>
                            </div>
                        </div>

                        <div class="col-12 d-flex flex-wrap align-items-center gap-3 mb-2">
                            <div class="d-flex align-items-center gap-2 flex-grow-1 flex-md-grow-0">
                                <label class="form-label mb-0 text-nowrap">Article: </label>
                                <div class="input-group input-group-merge" style="min-width: 150px;">
                                    <input class="form-control" data-name="articleId" placeholder="">
                                    <span class="input-group-text"><i class="ti ti-edit"></i></span>
                                </div>
                            </div>
                            <div class="d-flex align-items-center gap-2 error-message-server">
                                <label class="form-label mb-0" for="amount_en">Amount: </label>
                                <div class="d-flex align-items-center amount-block">
                                    <i class="ti ti-chevron-left icon-hover-arrow ms-2" data-name="arrow-left"></i>
                                    <input class="form-control text-center errorMy" id="amount_en" data-name="amount"
                                           style="width: 45px; background: transparent;" value="1">
                                    <i class="ti ti-chevron-right icon-hover-arrow ms-2" data-name="arrow-right"></i>
                                </div>
                            </div>
                        </div>

                        <div id="image-block-en" class="col-12 col-lg-5 text-center"></div>

                        <div class="col-12 col-lg-7">
                            <div class="row g-3">
                                <div class="col-12 col-md-6">
                                    <label for="name-en_" class="form-label fw-bold">Name:</label>
                                    <input class="form-control" id="name-en_" type="text" data-name="nameEn" data-sync="name">
                                </div>
                                <div class="col-12 col-md-6">
                                    <label for="tastes-en_" class="form-label fw-bold">Taste:</label>
                                    <select class="form-select select-card-block-spinner" id="tastes-en_">
                                        <option value="" selected></option>
                                    </select>
                                </div>
                                <div class="col-6">
                                    <label class="form-label fw-bold">Energy mass, kkal:</label>
                                    <input class="form-control" data-name="energyMass" type="text">
                                </div>
                                <div class="col-6">
                                    <label class="form-label fw-bold">Mass, kkal:</label>
                                    <input class="form-control" data-name="mass" type="text">
                                </div>
                                <div class="col-6">
                                    <label class="form-label fw-bold">Current price:</label>
                                    <input class="form-control bg-light" data-name="oldPrice" type="text" disabled/>
                                </div>
                                <div class="col-6">
                                    <label class="form-label fw-bold">New price:</label>
                                    <input class="form-control" data-name="newPrice" type="text">
                                </div>
                                <div class="col-12 col-md-6">
                                    <label for="discounts-en_" class="form-label fw-bold">Status discount:</label>
                                    <select class="form-select" id="discounts-en_">
                                        <option value="" selected></option>
                                    </select>
                                </div>

                                <div class="row g-3">
                                    <div class="col-12 col-md-6">
                                        <label for="recipe-en_" class="form-label fw-bold">Recipe:</label>
                                        <textarea class="form-control" id="recipe-en_" data-name="recipeUk" rows="3"></textarea>
                                    </div>
                                    <div class="col-12 col-md-6">
                                        <label for="condition-exploitation-en_" class="form-label fw-bold">Approach saving:</label>
                                        <textarea class="form-control" id="condition-exploitation-en_" data-name="conditionExploitationEn" rows="3"></textarea>
                                    </div>
                                </div>
                            </div>
                        </div>

                        <div class="col-12 border-bottom pb-4">
                            <div class="row g-3 align-items-center">
                                <div id="image-block-product-en" class="col-12 col-lg-5 text-center"></div>
                                <div class="col-12 col-lg-7">
                                    <label for="edit-description-product-en" class="form-label fw-bold">Description product:</label>
                                    <div id="edit-description-product-en" class="w-100" style="min-height: 100px; border: 1px solid #ccc;"></div>
                                    <label class="form-label small text-muted">Max: 2000 characters</label>
                                    <div id="hidden-edit-description-product-en" data-name="descriptionProductEn" style="display: none;"></div>
                                </div>
                            </div>
                        </div>

                        <div class="col-12 border-bottom pb-4">
                            <div class="row g-3 align-items-center">
                                <div id="image-block-payment-en" class="col-12 col-lg-5 text-center"></div>
                                <div class="col-12 col-lg-7">
                                    <label for="edit-description-payment-en" class="form-label fw-bold">Payment:</label>
                                    <div id="edit-description-payment-en" class="w-100" style="min-height: 100px; border: 1px solid #ccc;"></div>
                                    <label class="form-label small text-muted">Max: 2000 characters</label>
                                    <div id="hidden-edit-description-payment-en" data-name="descriptionPaymentEn" style="display: none;"></div>
                                </div>
                            </div>
                        </div>

                        <div class="col-12 border-bottom pb-4">
                            <div class="row g-3 align-items-center">
                                <div id="image-block-packing-en" class="col-12 col-lg-5 text-center"></div>
                                <div class="col-12 col-lg-7">
                                    <label for="edit-description-packing-en" class="form-label fw-bold">Packing:</label>
                                    <div id="edit-description-packing-en" class="w-100" style="min-height: 100px; border: 1px solid #ccc;"></div>
                                    <label class="form-label small text-muted">Max: 2000 characters</label>
                                    <div id="hidden-edit-description-packing-en" data-name="descriptionPackingEn" style="display: none;"></div>
                                </div>
                            </div>
                        </div>

                        <div class="col-12 mb-4">
                            <div class="row g-3 align-items-center">
                                <div id="image-block-delivery-en" class="col-12 col-lg-5 text-center"></div>
                                <div class="col-12 col-lg-7">
                                    <label for="edit-description-delivery-en" class="form-label fw-bold">Delivery:</label>
                                    <div id="edit-description-delivery-en" class="w-100" style="min-height: 100px; border: 1px solid #ccc;"></div>
                                    <label class="form-label small text-muted">Max: 2000 characters</label>
                                    <div id="hidden-edit-description-delivery-en" data-name="descriptionDeliveryEn" style="display: none;"></div>
                                </div>
                            </div>
                        </div>

                        <div id="save-block-en" class="col-12 text-center mb-3"></div>
                    </div>
                </div>
                <!--/ EN TAB -->

                <!-- Hidden Inputs-->
                <input type="hidden" id="hidden-status_" name="isActive" value="false">
                <input type="file" id="file-image1" data-type="image1" class="files"
                       accept="image/*" style="display: none;">
                <input type="file" id="file-image2" data-type="image2" class="files"
                       accept="image/*" style="display: none;">
                <input type="file" id="file-image3" data-type="image3" class="files"
                       accept="image/*" style="display: none;">
                <input type="file" id="file-image4" data-type="image4" class="files"
                       accept="image/*" style="display: none;">
                <input type="file" id="file-image-description" class="files" data-type="image-description"
                       accept="image/*" style="display: none;">
                <input type="file" id="file-image-payment" class="files" data-type="image-payment"
                       accept="image/*" style="display: none;">
                <input type="file" id="file-image-delivery" class="files" data-type="image-delivery"
                       accept="image/*" style="display: none;">
                <input type="file" id="file-image-packing" class="files" data-type="image-packing"
                       accept="image/*" style="display: none;">
                <!--/ Hidden Inputs-->


                <!-- Description Image Block -->
                <div id="shared-image-description" style="display: none;">
                    <div class="d-flex flex-column align-items-center ms-1 position-relative"
                         style="flex: 1;">
                        <img id="image-description" data-name="imageDescription"
                             src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcQGL-nM5H8eZfM19UQbIgDn0XwOUj1ByAyV4Q&s"
                             alt="error" style="width: 100%; height: 175px; display: block;">
                        <button type="button" data-type="image-description"
                                class="btn btn-label-success position-absolute top-50 start-50 translate-middle btn-select"
                                style="width: 55%;"
                                th:text="#{text.button.change}">
                        </button>
                        <button type="button" data-type="image-description"
                                class="btn btnTrashMyBefore position-absolute top-0 end-0 btn-delete">
                            <i class="ti ti-trash" style="font-size: x-large;"></i>
                        </button>
                    </div>
                    <div class="d-flex flex-column justify-content-center align-items-center"
                         style="flex: 1; text-align: center;">
                                <span style="color: darkgrey; margin-top: 10px;">
                                    png, jpg, jpeg, mp4 до 15 МБ
                                </span>
                    </div>
                </div>
                <!--/ Description Image Block -->

                <!-- Packing Image Block -->
                <div id="shared-image-packing" style="display: none;">
                    <div class="d-flex flex-column align-items-center ms-1 position-relative"
                         style="flex: 1;">
                        <img id="image-packing" data-name="imagePacking"
                             src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcQGL-nM5H8eZfM19UQbIgDn0XwOUj1ByAyV4Q&s"
                             alt="error" style="width: 100%; height: 175px; display: block;">
                        <button type="button" data-type="image-packing"
                                class="btn btn-label-success position-absolute top-50 start-50 translate-middle btn-select"
                                style="width: 55%;"
                                th:text="#{text.button.change}">
                        </button>
                        <button type="button" data-type="image-packing"
                                class="btn btnTrashMyBefore position-absolute top-0 end-0 btn-delete">
                            <i class="ti ti-trash" style="font-size: x-large;"></i>
                        </button>
                    </div>
                    <div class="d-flex flex-column justify-content-center align-items-center"
                         style="flex: 1; text-align: center;">
                                <span style="color: darkgrey; margin-top: 10px;"
                                      th:text="#{text.mediaSize15}">
                                </span>
                    </div>
                </div>
                <!--/ Payment Image Block -->

                <!-- Payment Image Block -->
                <div id="shared-image-payment" style="display: none;">
                    <div class="d-flex flex-column align-items-center ms-1 position-relative"
                         style="flex: 1;">
                        <img id="image-payment" data-name="imagePayment"
                             src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcQGL-nM5H8eZfM19UQbIgDn0XwOUj1ByAyV4Q&s"
                             alt="error" style="width: 100%; height: 175px; display: block;">
                        <button type="button" data-type="image-payment"
                                class="btn btn-label-success position-absolute top-50 start-50 translate-middle btn-select"
                                style="width: 55%;"
                                th:text="#{text.button.change}">
                        </button>
                        <button type="button" data-type="image-payment"
                                class="btn btnTrashMyBefore position-absolute top-0 end-0 btn-delete">
                            <i class="ti ti-trash" style="font-size: x-large;"></i>
                        </button>
                    </div>
                    <div class="d-flex flex-column justify-content-center align-items-center"
                         style="flex: 1; text-align: center;">
                                <span style="color: darkgrey; margin-top: 10px;"
                                      th:text="#{text.mediaSize15}">
                                </span>
                    </div>
                </div>
                <!--/ Payment Image Block -->

                <!-- Delivery Image Block -->
                <div id="shared-image-delivery" style="display: none;">
                    <div class="d-flex flex-column align-items-center ms-1 position-relative"
                         style="flex: 1;">
                        <img id="image-delivery" data-name="imageDelivery"
                             src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcQGL-nM5H8eZfM19UQbIgDn0XwOUj1ByAyV4Q&s"
                             alt="error" style="width: 100%; height: 175px; display: block;">
                        <button type="button" data-type="image-delivery"
                                class="btn btn-label-success position-absolute top-50 start-50 translate-middle btn-select"
                                style="width: 55%;"
                                th:text="#{text.button.change}">
                        </button>
                        <button type="button" data-type="image-delivery"
                                class="btn btnTrashMyBefore position-absolute top-0 end-0 btn-delete">
                            <i class="ti ti-trash" style="font-size: x-large;"></i>
                        </button>
                    </div>
                    <div class="d-flex flex-column justify-content-center align-items-center"
                         style="flex: 1; text-align: center;">
                        <span style="color: darkgrey; margin-top: 10px;"
                              th:text="#{text.mediaSize15}">
                        </span>
                    </div>
                </div>
                <!--/ Delivery Image Block -->

                <!-- Image Base -->
                <div id="shared-image" class="shared-image" style="display: none;">
                    <!-- Основне фото -->
                    <div class="position-relative">
                        <img id="image1" data-name="image1"
                             src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcQGL-nM5H8eZfM19UQbIgDn0XwOUj1ByAyV4Q&s"
                             alt="error"
                             style="width: 100%; height: 409px; display: block; margin: 0 auto;">

                        <button type="button" data-type="image1"
                                class="btn btn-success btn-image position-absolute top-50 start-50 translate-middle btn-select"
                                style="width: 55%;"
                                th:text="#{text.button.change}">
                        </button>
                        <button type="button" data-type="image1"
                                class="btn btnTrashMyBefore position-absolute top-0 end-0 me-2 mt-2 btn-delete">
                            <i class="ti ti-trash" style="font-size: x-large;"></i>
                        </button>
                    </div>

                    <!-- Три фото в ряд -->
                    <div class="mt-3 row row-cols-1 row-cols-sm-3 g-3">
                        <div class="col text-center position-relative">
                            <img id="image2" data-name="image2"

                <script th:src="@{/js/image.js}"></script>

                <script>
                    function copyHTMLBlockImage(fromElementId, toElementId) {
                        $(`#${toElementId}`).html($(`#${fromElementId}`).html());
                        addEventListenersImage2();
                        clearBlock(fromElementId);
                    }
                </script>
                <script>
                    function getFroalaEditor(idElementEditor) {

                        const hiddenElementSelector = `#hidden-${idElementEditor}`;

                        return new FroalaEditor(`#${idElementEditor}`, {
                            theme: current_mode,
                            height: 200,
                            width: 'auto',
                            scrollableContainer: `#${idElementEditor}`,
                            toolbarButtons: [
                                ['bold', 'italic', 'underline', 'strikeThrough'],
                                ['formatOL', 'formatUL', 'align', 'formatBlock'],
                                ['insertLink', 'undo', 'redo', 'html']
                            ],
                            events: {
                                'initialized': function () {
                                    let initialContent = $(hiddenElementSelector).html() || '';
                                    this.html.set(initialContent);
                                },
                                'contentChanged': function () {
                                    const html = this.html.get();
                                    $(hiddenElementSelector).html(html);

                                    if ($(hiddenElementSelector).is('input, textarea')) {
                                        $(hiddenElementSelector).val(html);
                                    }
                                }
                            }
                        });
                    }
                </script>
                <script>
                    document.querySelectorAll('[data-bs-toggle="tab"]').forEach(tab => {
                        tab.addEventListener('shown.bs.tab', function (event) {
                            const activatedTabId = event.target ? event.target.getAttribute('data-lang') : null;
                            let previousActiveTab = event.relatedTarget ? event.relatedTarget.getAttribute('data-lang') : null;


                            if (previousActiveTab) {
                                copyHTMLBlockImage(`image-block-${previousActiveTab}`, 'shared-image');
                                copyHTMLBlockSave(`save-block-${previousActiveTab}`, 'shared-save');
                                copyHTMLBlockTextImage(`image-block-product-${previousActiveTab}`, 'shared-image-description');
                                copyHTMLBlockTextImage(`image-block-packing-${previousActiveTab}`, 'shared-image-packing');
                                copyHTMLBlockTextImage(`image-block-payment-${previousActiveTab}`, 'shared-image-payment');
                                copyHTMLBlockTextImage(`image-block-delivery-${previousActiveTab}`, 'shared-image-delivery');
                            }

                            if (activatedTabId) {
                                copyHTMLBlockImage('shared-image', `image-block-${activatedTabId}`);
                                copyHTMLBlockSave('shared-save', `save-block-${activatedTabId}`);
                                copyHTMLBlockTextImage('shared-image-description', `image-block-product-${activatedTabId}`);
                                copyHTMLBlockTextImage('shared-image-packing', `image-block-packing-${activatedTabId}`);
                                copyHTMLBlockTextImage('shared-image-payment', `image-block-payment-${activatedTabId}`);
                                copyHTMLBlockTextImage('shared-image-delivery', `image-block-delivery-${activatedTabId}`);
                            }
                        });
                    });

                    $(document).ready(function () {
                        let activeLang = getActiveLangTab();
                        copyHTMLBlockImage('shared-image', `image-block-${activeLang}`);
                        copyHTMLBlockSave('shared-save', `save-block-${activeLang}`);
                        copyHTMLBlockTextImage('shared-image-description', `image-block-product-${activeLang}`);
                        copyHTMLBlockTextImage('shared-image-packing', `image-block-packing-${activeLang}`);
                        copyHTMLBlockTextImage('shared-image-payment', `image-block-payment-${activeLang}`);
                        copyHTMLBlockTextImage('shared-image-delivery', `image-block-delivery-${activeLang}`);

                        addEventListenerNameManager();
                        getTastesAndDiscounts();
                        addEventListenerForSwitch();
                        selectedLanguage();
                        addEventListenerCounter();
                        addEventListenerSyncFields('[data-name="status"], [data-name="articleId"]' +
                            ', [data-name="amount"], [data-name="energyMass"], [data-name="mass"], [data-name="newPrice"]');
                        clearErrorWhenChangeValue('[data-name="nameUk"],[data-name="nameEn"]');

                        const editorDescProductUK = getFroalaEditor("edit-description-product-uk");
                        const editorDescPackingUK = getFroalaEditor("edit-description-packing-uk");
                        const editorDescPaymentUK = getFroalaEditor("edit-description-payment-uk");
                        const editorDescDeliveryUK = getFroalaEditor("edit-description-delivery-uk");

                        const editorDescProductEN = getFroalaEditor("edit-description-product-en");
                        const editorDescPackingEN = getFroalaEditor("edit-description-packing-en");
                        const editorDescPaymentEN = getFroalaEditor("edit-description-payment-en");
                        const editorDescDeliveryEN = getFroalaEditor("edit-description-delivery-en");
                    });

                    const url = `${contextPath}/admin/product/save`;
                    let isValidFields = true;

                    function getActiveLangTab() {
                        return document.querySelector('button.nav-link.active').getAttribute('data-lang');
                    }

                    function addEventListenerForSwitch() {
                        $('#discounts-uk_, #discounts-en_').on('change', function () {
                            if (this.id === 'discounts-uk_') {
                                let selector = $('#discounts-en_');
                                selector.val(this.value);
                            } else if (this.id === 'discounts-en_') {
                                let selector = $('#discounts-uk_');
                                selector.val(this.value);
                            }
                        });
                        $('#tastes-uk_, #tastes-en_').on('change', function () {
                            if (this.id === 'tastes-uk_') {
                                let selector = $('#tastes-en_');
                                selector.val(this.value);
                            } else if (this.id === 'tastes-en_') {
                                let selector = $('#tastes-uk_');
                                selector.val(this.value);
                            }
                        });
                    }
                </script>
                <script>
                    function fillDataInSelectors(arr, elSelector) {
                        if (elSelector) {
                            arr.forEach(function (el) {
                                let option = document.createElement("option");
                                option.value = el.id;
                                option.textContent = el.name;
                                elSelector.append(option);
                            });
                        }
                    }

                    function getTastesAndDiscounts() {
                        let request = new XMLHttpRequest();
                        request.open("GET", `${contextPath}/admin/tastesAndDiscounts/get`);
                        request.send();
                        request.addEventListener('load', function () {
                            if (request.status === 200) {
                                let data = JSON.parse(request.response);
                                let selectorTasteUk = document.getElementById("tastes-uk_");
                                let selectorTasteEn = document.getElementById("tastes-en_");
                                let selectorDiscountUk = document.getElementById("discounts-uk_");
                                let selectorDiscountEn = document.getElementById("discounts-en_");
                                fillDataInSelectors(data.tastesUk, selectorTasteUk);
                                fillDataInSelectors(data.tastesEn, selectorTasteEn);
                                fillDataInSelectors(data.discountsUk, selectorDiscountUk);
                                fillDataInSelectors(data.discountsEn, selectorDiscountEn);
                            }
                        });
                    }

                    function saveRequest(url) {
                        if (!isValidFields) {
                            console.error("Validation Error: Previous fields weren't validate for request!");
                            return;
                        }
                        let formData = getFormData();
                        $.ajax({
                            type: "post",
                            url: url,
                            data: formData,
                            processData: false,
                            contentType: false,
                            success: function () {
                                window.location.replace(`${contextPath}/admin/products`);
                            },
                            error: function (error) {
                                clearValid();
                                let data = JSON.parse(error.responseText);
                                validate2(data);
                                console.log("Error submitting form:", error);
                            }
                        });
                    }

                    function getFormData() {
                        const resForm = new FormData();
                        resForm.append("nameUk", $('#name-uk_').val());
                        resForm.append("nameEn", $('#name-en_').val());
                        resForm.append("articleId", $(`[data-name="articleId"]`).val());
                        resForm.append("amount", $(`[data-name="amount"]`).val());
                        resForm.append("isActive", $(`[data-name="status"]`).is(':checked'));
                        resForm.append("recipeUk", $('#recipe-uk_').val());
                        resForm.append("recipeEn", $('#recipe-en_').val());
                        resForm.append("conditionExploitationUk", $('#condition-exploitation-uk_').val());
                        resForm.append("conditionExploitationEn", $('#condition-exploitation-en_').val());
                        resForm.append("newPrice", $('[data-name="newPrice"]').val());

                        resForm.append("energyMass", $(`[data-name="energyMass"]`).val());
                        resForm.append("mass", $('[data-name="mass"]').val());
                        resForm.append("discountId", $('#discounts-uk_').val());
                        resForm.append("tasteId", $('#tastes-uk_').val());

                        resForm.append("descriptionProductUk", document.getElementById("hidden-edit-description-product-uk").innerHTML);
                        resForm.append("descriptionProductEn", document.getElementById("hidden-edit-description-product-en").innerHTML);
                        resForm.append("descriptionPackingUk", document.getElementById("hidden-edit-description-packing-uk").innerHTML);
                        resForm.append("descriptionPackingEn", document.getElementById("hidden-edit-description-packing-en").innerHTML);
                        resForm.append("descriptionPaymentUk", document.getElementById("hidden-edit-description-payment-uk").innerHTML);
                        resForm.append("descriptionPaymentEn", document.getElementById("hidden-edit-description-payment-en").innerHTML);
                        resForm.append("descriptionDeliveryUk", document.getElementById("hidden-edit-description-delivery-uk").innerHTML);
                        resForm.append("descriptionDeliveryEn", document.getElementById("hidden-edit-description-delivery-en").innerHTML);


                        let files = [
                            {id: "#file-image1", fieldName: "image1"},
                            {id: "#file-image2", fieldName: "image2"},
                            {id: "#file-image3", fieldName: "image3"},
                            {id: "#file-image4", fieldName: "image4"},
                            {id: "#file-image-description", fieldName: "imageDescription"},
                            {id: "#file-image-payment", fieldName: "imagePayment"},
                            {id: "#file-image-packing", fieldName: "imagePacking"},
                            {id: "#file-image-delivery", fieldName: "imageDelivery"}
                        ];

                        files.forEach(function (fileObj) {
                            let file = $(fileObj.id)[0].files[0];
                            if (file) {
                                resForm.append(fileObj.fieldName, file);
                            }
                        });
                        return resForm;
                    }
                </script>
            </div>
        </form>
    </div>
</div>
