<!DOCTYPE html>
<html lang="гл"
      layout:decorate="~{admin/blocks/layout.html}"
      xmlns:layout="http://www.w3.org/1999/xhtml"
      xmlns="http://www.w3.org/1999/html">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title th:text="#{text.factory} + '' +#{text.page}"></title>
    <link rel="stylesheet" th:href="@{/vuexy/assets/vendor/libs/bootstrap-datepicker/bootstrap-datepicker.css}"/>
</head>
<body>
<!-- Content -->
<div layout:fragment="content" class="container-xxl p-0">
    <div class="flex-shrink-1 flex-grow-1 container-p-x container-p-y">

        <!-- Header content -->
        <div class="row mb-4">
            <div class="col-12 d-flex flex-wrap align-items-center gap-2">
                <a th:href="@{/admin/pages}" class="d-flex align-items-center">
                    <i class="ti ti-arrow-left icon-hover-arrow" style="color: green; font-size: 30px;"></i>
                </a>
                <span class="text-nowrap" th:text="#{text.page}"></span>
                <i class="ti ti-arrow-right text-muted" style="font-size: 14px;"></i>
                <span class="fw-bold text-nowrap" th:text="#{text.about} + ' ' + #{text.factory}"></span>
            </div>
        </div>
        <!--/ Header content -->

        <!-- Language tabs -->
        <div class="nav-align-top mb-3">
            <ul class="nav nav-tabs" role="tablist" style="background: none;">
                <li class="nav-item">
                    <button type="button" class="nav-link active" data-bs-toggle="tab"
                            data-bs-target="#navs-uk" aria-controls="navs-uk" aria-selected="true"
                            data-lang="uk">
                        <i class="ti ti-planet me-1"></i>
                        <span>UK</span>
                    </button>
                </li>
                <li class="nav-item">
                    <button type="button" class="nav-link" data-bs-toggle="tab"
                            data-bs-target="#navs-en" aria-controls="navs-en" aria-selected="false"
                            data-lang="en">
                        <i class="ti ti-planet me-1"></i>
                        <span>EN</span>
                    </button>
                </li>
            </ul>
        </div>
        <!--/ Language tabs -->

        <div class="tab-content" id="pills-tabContent">
            <!-- UK Form -->
            <div class="tab-pane fade show active" id="navs-uk" role="tabpanel"
                 data-bs-toggle="tab">

                <div class="row g-4 mb-4">
                    <div class="col-12 d-flex align-items-center justify-content-center flex-wrap gap-2">
                        <h4 class="mb-0">1 блок - Баннер</h4>
                        <div id="status-factory-banner-uk"></div>
                    </div>

                    <div class="col-12 col-lg-6" id="image-factory-banner-block-uk"></div>

                    <div class="col-12 col-lg-6">
                        <div class="mb-3">
                            <label class="form-label fw-bold small">Заголовок:</label>
                            <input class="form-control" id="factory-banner-title-uk_" data-name="factoryBannerTitleUk">
                        </div>
                        <div class="mb-3">
                            <label class="form-label fw-bold small">Опис:</label>
                            <textarea class="form-control" id="factory-banner-description-uk_" rows="4"
                                      data-name="factoryBannerDescriptionUk"></textarea>
                            <small class="text-muted">Максимум: 150 символів</small>
                        </div>
                    </div>
                </div>

                <hr class="my-4">

                <div class="row g-4">
                    <div class="col-12 d-flex align-items-center justify-content-center flex-wrap gap-2">
                        <h4 class="mb-0">2 блок</h4>
                        <div id="status-block-uk"></div>
                    </div>

                    <div class="col-12">
                        <div class="row row-cols-1 row-cols-sm-2 row-cols-md-3 row-cols-lg-4 g-3 mb-3"
                             id="container-factory-block-images-uk">
                            <div class="col" id="add-button-container">
                                <div class="rounded d-flex flex-column align-items-center justify-content-center p-3 h-100"
                                     style="min-height: 200px;">
                                    <button class="btn btn-outline-success btn-sm mb-2" id="btn-add-media-block">
                                        Додати медіа
                                    </button>
                                    <span class="text-center small text-muted" th:text="#{text.mediaSize10}"></span>
                                </div>
                            </div>
                        </div>
                    </div>

                    <div class="col-12 col-lg-6">
                        <div class="mb-3">
                            <label class="form-label fw-bold small">Заголовок:</label>
                            <input class="form-control" id="factory-block-title-uk_" data-name="factoryBlockTitleUk">
                        </div>

                        <div class="mb-3">
                            <label class="form-label fw-bold small">Опис:</label>
                            <div id="edit-description-block-uk" class="editor-realise" style="min-height: 150px;"></div>
                            <small class="text-muted">Максимум: 3500 символів</small>
                            <div id="hidden-edit-description-block-uk" data-name="factoryBlockDescriptionUk"
                                 style="display: none;" class="editors"></div>
                        </div>
                    </div>
                </div>

                <hr class="my-4">

                <div class="d-flex justify-content-center py-4" id="save-block-uk"></div>

            </div>
            <!--/ UK Form -->

            <!-- EN Form -->
            <div class="tab-pane fade mb-5" id="navs-en" role="tabpanel" data-bs-toggle="tab">
                <div class="row g-4 mb-4">
                    <div class="col-12 d-flex align-items-center justify-content-center flex-wrap gap-2">
                        <h4 class="mb-0">1 block - Banner</h4>
                        <div id="status-factory-banner-en"></div>
                    </div>
                    <div class="col-12 col-lg-6" id="image-factory-banner-block-en"></div>
                    <div class="col-12 col-lg-6">
                        <div class="mb-3">
                            <label class="form-label fw-bold small">Title:</label>
                            <input class="form-control" id="factory-banner-title-en_" data-name="factoryBannerTitleEn">
                        </div>
                        <div class="mb-3">
                            <label class="form-label fw-bold small">Description:</label>
                            <textarea class="form-control" id="factory-banner-description-en_" rows="4"
                                      data-name="factoryBannerDescriptionEn"></textarea>
                            <small class="text-muted">Max: 150 characters</small>
                        </div>
                    </div>
                </div>

                <hr class="my-4">

                <div class="row g-4">
                    <div class="col-12 d-flex align-items-center justify-content-center flex-wrap gap-2">
                        <h4 class="mb-0">2 block</h4>
                        <div id="status-block-en"></div>
                    </div>
                    <div class="col-12">
                        <div class="row row-cols-1 row-cols-sm-2 row-cols-md-3 row-cols-lg-4 g-3 mb-3"
                             id="container-factory-block-images-en">
                        </div>
                    </div>
                    <div class="col-12 col-lg-6">
                        <div class="mb-3">
                            <label class="form-label fw-bold small">Title:</label>
                            <input class="form-control" id="factory-block-title-uk_en_" data-name="factoryBlockTitleEn">
                        </div>

                        <div class="mb-3">
                            <label class="form-label fw-bold small">Description:</label>
                            <div id="edit-description-block-en" class="editor-realise" style="min-height: 150px;"></div>
                            <small class="text-muted">Max: 3500 characters</small>
                            <div id="hidden-edit-description-block-en" data-name="factoryBlockDescriptionEn"
                                 style="display: none;" class="editors"></div>
                        </div>
                    </div>
                </div>

                <hr class="my-4">

                <div class="d-flex justify-content-center py-4" id="save-block-en"></div>

            </div>
            <!--/ EN Form -->

            <!-- Input hidden -->
            <input type="hidden" id="factoryBannerId_" data-name="factoryBannerId">
            <input type="hidden" id="factoryBlockId_" data-name="factoryBlockId">
            <input type="file" id="file-factoryBannerFile" data-type="factoryBannerFile" class="files"
                   accept="image/*" style="display: none;">
            <input type="hidden" data-name="factoryBannerPathToImage" class="files" data-image="factoryBannerFile">

            <!-- Input Medias hidden -->
            <div id="container-inputs"></div>
            <!--/ Input Medias hidden -->

            <!--/ Input hidden -->

            <!-- Status Catalog Banner Base -->
            <div id="shared-status-catalog-banner" style="display: none;">
                <label class="switch switch-success mt-1">
                    <input id="status-catalog-banner" data-name="factoryBannerIsActive" type="checkbox"
                           class="switch-input">
                    <span class="switch-toggle-slider">
                                            <span class="switch-on"></span>
                                            <span class="switch-off"></span>
                                         </span>
                </label>
            </div>
            <!--/ Status Catalog Banner Base -->

            <!-- Status Block Base -->
            <div id="shared-status-factory-block" style="display: none;">
                <label class="switch switch-success mt-1">
                    <input id="status-factory-block" data-name="factoryBlockIsActive" type="checkbox"
                           class="switch-input">
                    <span class="switch-toggle-slider">
                                            <span class="switch-on"></span>
                                            <span class="switch-off"></span>
                                         </span>
                </label>
            </div>
            <!--/ Status Block Base -->

            <!-- Image Catalog Base -->
            <div id="shared-image-factory-banner" style="display: none;">
                <div class="position-relative">
                    <img id="factoryBannerFile" data-name="factoryBannerFile"
                         th:src="@{'/image/default-image.jpg'}"
                         alt="error" style="width: 100%; height: 255px; display: block; margin: 0 auto;"
                         data-error="requestFactoryBannerForAdd.factoryBannerFile">
                    <button type="button" data-type="factoryBannerFile"
                            class="btn btn-outline-success btn-select"
                            style="left: 13%;top:25%;position: absolute;width: 35%;"
                            th:text="#{text.button.change}">
                    </button>
                    <button type="button" data-type="factoryBannerFile"
                            class="btn btn-outline-success btn-delete"
                            style="right: 13%;top:25%;position: absolute;width: 35%;"
                            th:text="#{text.button.delete}">
                    </button>
                    <span class="text-center"
                          style="font-size: small; color: darkgrey; display: block; margin-top: 10px;"
                          th:text="#{text.mediaSize15}"></span>
                </div>


            </div>
            <!--/ Image Catalog Base -->

            <!-- Button save Base -->
            <div id="shared-save" style="display: none;">
                <button type="button" class="btn btn-green w-50" id="btn-save_"
                        th:text="#{text.button.save}"></button>
            </div>
            <!--/ Button save Base -->

            <script th:src="@{/vuexy/assets/vendor/libs/bootstrap-datepicker/bootstrap-datepicker.js}"></script>
            <script th:src="@{/js/image.js}"></script>
            <script th:src="@{/js/validator.js}"></script>
            <script th:src="@{/js/copy.js}"></script>
            <script th:src="@{/js/event-listener.js}"></script>

            <script>
                function copyHTMLBlockImage(fromElementId, toElementId) {
                    $(`#${toElementId}`).html($(`#${fromElementId}`).html());
                    addEventListenersImage2();
                    clearBlock(fromElementId);
                }

                function copyHTMLBlockSave(fromElementId, toElementId) {
                    $(`#${toElementId}`).html($(`#${fromElementId}`).html());
                    document.getElementById('btn-save_').addEventListener('click', function () {
                        saveRequest(urlCatalogBlock);
                    });
                    clearBlock(fromElementId);
                }
            </script>
            <script>
                function getFroalaEditor(idElementEditor) {
                    return new FroalaEditor(`#${idElementEditor}`, {
                        theme: current_mode,
                        height: 120,
                        width: 'auto',
                        scrollableContainer: `#${idElementEditor}`,
                        events: {
                            'initialized': function () {
                                let element = $(`#hidden-${idElementEditor}`);
                                this.html.set(element.html() || '');
                                this.opts.toolbarSticky = false;
                            },
                            'contentChanged': function () {
                                const html = this.html.get();
                                $(`#hidden-${idElementEditor}`).html(html);
                            }
                        }
                    });
                }
            </script>
            <script>
                document.querySelectorAll('[data-bs-toggle="tab"]').forEach(tab => {
                    tab.addEventListener('shown.bs.tab', function (event) {
                        const activatedTabId = event.target ? event.target.getAttribute('data-lang') : null;
                        let previousActiveTab = event.relatedTarget ? event.relatedTarget.getAttribute('data-lang') : null;

                        if (previousActiveTab) {
                            copyHTMLBlockImage(`image-factory-banner-block-${previousActiveTab}`, 'shared-image-factory-banner');
                            copyHTMLBlockSave(`save-block-${previousActiveTab}`, 'shared-save');
                            copyHTMLBlockSwitch(`status-factory-banner-${previousActiveTab}`, 'shared-status-catalog-banner');
                            copyHTMLBlockSwitch(`status-block-${previousActiveTab}`, 'shared-status-factory-block');
                        }

                        if (activatedTabId) {
                            copyHTMLBlockImage('shared-image-factory-banner', `image-factory-banner-block-${activatedTabId}`);
                            copyHTMLBlockSave('shared-save', `save-block-${activatedTabId}`);
                            copyHTMLBlockSwitch('shared-status-catalog-banner', `status-factory-banner-${activatedTabId}`);
                            copyHTMLBlockSwitch('shared-status-factory-block', `status-block-${activatedTabId}`);
                        }

                        copyHTMLBlockImage(`container-factory-block-images-${previousActiveTab}`, `container-factory-block-images-${activatedTabId}`);
                        addEventListenerForMediaFiles(activatedTabId);
                    });
                });

                $(document).ready(function () {
                    let activeLang = getActiveLangTab();
                    copyHTMLBlockImage('shared-image-factory-banner', `image-factory-banner-block-${activeLang}`);
                    copyHTMLBlockSave('shared-save', `save-block-${activeLang}`);
                    copyHTMLBlockSwitch('shared-status-catalog-banner', `status-factory-banner-${activeLang}`);
                    copyHTMLBlockSwitch('shared-status-factory-block', `status-block-${activeLang}`);
                    requestGetData();
                    addEventListenerForMediaFiles(activeLang);
                    selectedLanguage();
                });

                const urlCatalogBlock = `${contextPath}/admin/page/factory/save`;

                function addEventListenerForMediaFiles(langActive) {
                    const container = "#container-factory-block-images-" + langActive;

                    $(container).off('click', '.btn-select').on('click', '.btn-select', function () {
                        let attribute = $(this).attr('data-type');
                        $("#file-" + attribute).click();
                    });

                    $('#container-inputs').off('change', '.files').on('change', '.files', function (event) {
                        let attribute = $(this).data('type');
                        const file = event.target.files[0];
                        if (!file) return;

                        const imageElement = $("#" + attribute);
                        imageElement.attr('src', URL.createObjectURL(file));
                        $(`input[data-image="${attribute}"]`).val('');
                    });

                    $(container).off('click', '.btn-delete').on('click', '.btn-delete', function () {
                        let value = $(this).data('type');
                        $(`#file-${value}`).remove();
                        $(`input[data-image="${value}"]`).remove();
                        $(this).closest('div.dynamic-media-item').remove();
                    });

                    $('#btn-add-media-block').off('click').on('click', function () {
                        addMediaImageBlock('new');
                    });
                }

                function getActiveLangTab() {
                    return document.querySelector('button.nav-link.active').getAttribute('data-lang');
                }
            </script>
            <script>
                function saveRequest(url) {
                    let formData = getFormCatalog();

                    $.ajax({
                        type: "post",
                        url: url,
                        data: formData,
                        processData: false,
                        contentType: false,
                        success: function () {
                            window.location.reload();
                        },
                        error: function (error) {
                            clearValid();
                            let data = JSON.parse(error.responseText);
                            validate3(data);
                            console.log("Error submitting form:", error);
                        }
                    });
                }

                function getFormCatalog() {
                    let resForm = new FormData();
                    resForm.append('requestFactoryBannerForAdd.factoryBannerId', $("#factoryBannerId_").val());
                    resForm.append("requestFactoryBannerForAdd.factoryBannerIsActive", $("#status-catalog-banner").prop('checked'));
                    resForm.append("requestFactoryBannerForAdd.factoryBannerTitleUk", $("#factory-banner-title-uk_").val());
                    resForm.append("requestFactoryBannerForAdd.factoryBannerTitleEn", $("#factory-banner-title-en_").val());
                    resForm.append("requestFactoryBannerForAdd.factoryBannerDescriptionUk", $("#factory-banner-description-uk_").val());
                    resForm.append("requestFactoryBannerForAdd.factoryBannerDescriptionEn", $("#factory-banner-description-en_").val());
                    resForm.append("requestFactoryBannerForAdd.factoryBannerPathToBanner", $('input[data-name="factoryBannerPathToImage"]').val());
                    let factoryBannerFile = $('#file-factoryBannerFile')[0].files[0];
                    if (factoryBannerFile) {
                        resForm.append('requestFactoryBannerForAdd.factoryBannerFile', factoryBannerFile);
                    }

                    let langActive = getActiveLangTab();
                    let $containerFactoryImages = $(`#container-factory-block-images-${langActive} .dynamic-media-item`);
                    let counter = 0;

                    $containerFactoryImages.each(function () {
                        let attrId = $(this).attr("data-id");
                        let attrDataType = $(this).attr('data-type');
                        if (attrId) {
                            let $file = $(`input[data-type="image${attrId}"]`);
                            let $pathToFile = $(`input[data-image="image${attrId}"]`);
                            let file = $file[0].files[0];
                            if (attrDataType && attrDataType !== 'new') resForm.append(`requestFactoryBlockForAdd.factoryBlockFiles[${counter}].id`, attrId);
                            if ($file[0].files.length > 0) resForm.append(`requestFactoryBlockForAdd.factoryBlockFiles[${counter}].fileImage`, file);
                            resForm.append(`requestFactoryBlockForAdd.factoryBlockFiles[${counter}].pathToImage`, $pathToFile.val() === 'undefined' ? '' : $pathToFile.val());
                        }
                        counter++;
                    });
                    resForm.append(`requestFactoryBlockForAdd.factoryBlockId`, $("#factoryBlockId_").val());
                    resForm.append(`requestFactoryBlockForAdd.factoryBlockIsActive`, $("#status-factory-block").prop('checked'));
                    resForm.append(`requestFactoryBlockForAdd.factoryBlockTitleUk`, $('#factory-block-title-uk_').val());
                    resForm.append(`requestFactoryBlockForAdd.factoryBlockTitleEn`, $('#factory-block-title-uk_en_').val());
                    resForm.append(`requestFactoryBlockForAdd.factoryBlockDescriptionUk`, $('#hidden-edit-description-block-uk').html());
                    resForm.append(`requestFactoryBlockForAdd.factoryBlockDescriptionEn`, $('#hidden-edit-description-block-en').html());
                    return resForm;
                }

                function requestGetData() {
                    let request = new XMLHttpRequest();
                    request.open("GET", `${contextPath}/admin/page/factory/data`);
                    request.send();
                    request.addEventListener('load', function () {
                        if (request.status === 200) {
                            let data = JSON.parse(request.response);
                            for (let key in data) {
                                let nestedObject = data[key];
                                if (typeof nestedObject === 'object' && nestedObject !== null) {
                                    for (let nestedKey in nestedObject) {
                                        if (nestedObject.hasOwnProperty(nestedKey)) {
                                            let input = $(`input[data-name="${nestedKey}"], textarea[data-name="${nestedKey}"], div[data-name="${nestedKey}"]`);
                                            if (input) {
                                                if (input.hasClass('files')) {
                                                    let img = input.attr('data-image');
                                                    let $input = $(`#${img}`);
                                                    if ($input && nestedObject[nestedKey] && nestedObject[nestedKey] !== null) {
                                                        $input.attr('src', contextPath + nestedObject[nestedKey]);
                                                        input.val(nestedObject[nestedKey]);
                                                    }
                                                } else if (input.hasClass('editors')) {
                                                    let $div = $(input);
                                                    if ($div) {
                                                        $div.html(nestedObject[nestedKey]);
                                                        let parent = $div.parent();
                                                        let find = parent.find('.editor-realise');
                                                        getFroalaEditor(find[0].getAttribute('id'));
                                                    }
                                                } else {
                                                    if (typeof nestedObject[nestedKey] === 'boolean') {
                                                        let isActiveEl = $(`input[data-name="${nestedKey}"]`)[0];
                                                        if (isActiveEl) {
                                                            isActiveEl.checked = nestedObject[nestedKey];
                                                        }
                                                    } else if (nestedKey === 'factoryBlockFiles') {
                                                        let array = nestedObject[nestedKey];
                                                        if (Array.isArray(array)) {
                                                            array.forEach(function (el) {
                                                                addMediaImageBlock('old', el.id, el.pathToImage);
                                                            });
                                                        }
                                                    } else {
                                                        input.val(nestedObject[nestedKey]);
                                                    }
                                                }
                                            }

                                        }
                                    }
                                }
                            }
                        }
                    });
                }

                let counter = 0;

                function addMediaImageBlock(TYPE, ID, PATH) {
                    const col = document.createElement('div');
                    col.className = 'col dynamic-media-item';

                    let UUID = ID ? ID : new Date().getTime();
                    col.dataset.id = UUID;
                    col.dataset.type = TYPE;

                    const fullPath = PATH ? contextPath + PATH : path_default_image;

                    col.innerHTML = `
                        <div class="card h-100 shadow-none border position-relative">
                            <div style="height: 167px; overflow: hidden;" class="rounded-top">
                                <img id="image${UUID}"
                                     data-name="image${UUID}"
                                     src="${fullPath}"
                                     class="w-100 h-100 object-fit-cover"
                                     alt="media"
                                     data-error="requestFactoryBlockForAdd.factoryBlockFiles[${counter}].fileImage">
                            </div>

                            <div class="card-body p-2 d-flex justify-content-center gap-2">
                                <button type="button" data-type="image${UUID}"
                                        class="btn btn-sm btn-outline-success btn-select"
                                        title="Змінити">
                                    <i class="ti ti-edit"></i>
                                </button>
                                <button type="button" data-type="image${UUID}" data-typedelete="delete-image"
                                        class="btn btn-sm btn-outline-danger btn-delete"
                                        title="Видалити">
                                    <i class="ti ti-trash"></i>
                                </button>
                            </div>

                            <input type="file" id="file-image${UUID}" data-type="image${UUID}"
                                   class="files d-none" accept="image/*">
                            <input type="hidden" data-name="pathToImage${UUID}" data-image="image${UUID}"
                                   class="files" value="${PATH ? PATH : ''}">
                        </div>
                    `;

                    const lang = getActiveLangTab();
                    const container = document.getElementById(`container-factory-block-images-${lang}`);

                    const addButtonContainer = container.querySelector('#add-button-container');

                    if (addButtonContainer) {
                        container.insertBefore(col, addButtonContainer);
                    } else {
                        container.appendChild(col);
                    }

                    counter++;
                }
            </script>
        </div>
    </div>
</div>
<!--/ Content -->
</body>
</html>
