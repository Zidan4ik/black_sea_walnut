<div class="col-12 col-lg-6 mb-4 gallery-item-row" th:each="p:${list}" th:data-id="${p.getId()}" data-type="old">
    <div class="row g-3 rounded p-2 m-0">

        <div class="col-12 col-sm-5 text-center">
            <div class="d-inline-block">
                <img th:id="'image'+${p.getId()}"
                     th:src="${(p.getPathToMediaFile()!=null && !p.getPathToMediaFile().isEmpty())? '/Walnut-R.Pravnyk' + p.getPathToMediaFile() : 'https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcQGL-nM5H8eZfM19UQbIgDn0XwOUj1ByAyV4Q&s'}"
                     alt="media"
                     class="img-fluid rounded border shadow-sm"
                     style="width: 100%; max-width: 200px; height: 180px; object-fit: cover;">

                <label class="form-label d-block mt-1 small text-muted" th:text="#{text.mediaSize15}"></label>

                <div class="d-flex flex-column gap-2 mt-2">
                    <button type="button" class="btn btn-sm btn-success btn-select w-100"
                            th:data-type="'image'+${p.getId()}"
                            style="background-color: #337D5A; border-color: #337D5A;">
                        <span th:text="#{text.button.change}"></span>
                    </button>
                    <button type="button" class="btn btn-sm btn-outline-danger btn-delete w-100"
                            th:data-type="'image'+${p.getId()}" data-typeDelete="delete-image">
                        <span th:text="#{text.button.delete}"></span>
                    </button>
                </div>
            </div>

            <input type="file" th:id="'file-image'+${p.getId()}" th:data-type="'image'+${p.getId()}"
                   class="files d-none" data-error="file" accept="image/*">
            <input type="hidden" th:data-name="'pathToImage'+${p.getId()}" th:data-image="'image'+${p.getId()}"
                   class="files" data-error="pathToMediaFile" th:value="${p.getPathToMediaFile()}">
        </div>

        <div class="col-12 col-sm-7">
            <div class="d-flex justify-content-evenly justify-content-lg-between align-items-center mb-2">
                <label class="switch switch-success">
                    <input type="checkbox" class="switch-input status" th:checked="${p.isActive()}" data-error="isActive">
                    <span class="switch-toggle-slider">
                        <span class="switch-on"></span>
                        <span class="switch-off"></span>
                    </span>
                </label>
                <a type="button" class="btn btnTrashMyBefore btn-delete p-0" data-typeDelete="delete-object">
                    <i class="ti ti-trash fs-3"></i>
                </a>
            </div>

            <div class="mb-2">
                <label class="form-label fw-bold small mb-1" th:text="#{text.title}"></label>
                <input class="form-control titles" th:value="${p.getTitle()}" data-error="title">
            </div>

            <div class="mb-0">
                <label class="form-label fw-bold small mb-1" th:text="#{text.description}"></label>
                <textarea class="form-control descriptions" rows="3"
                          th:text="${p.getDescription()}" data-error="description"></textarea>
                <label class="form-label small text-muted mt-1" th:text="#{text.max600}"></label>
            </div>
        </div>
    </div>
</div>
