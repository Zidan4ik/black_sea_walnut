<!DOCTYPE html>
<html lang="uk"
      layout:decorate="~{admin/blocks/layout.html}"
      xmlns:layout="http://www.w3.org/1999/xhtml"
      xmlns="http://www.w3.org/1999/html">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title th:text="#{text.new}"></title>
</head>
<body>
<!-- Content -->
<div layout:fragment="content" class="container-xxl p-0">
    <div class="flex-shrink-1 flex-grow-1 container-p-x container-p-y">

        <!-- Header content -->
        <div class="row mb-4 align-items-center g-3">
            <div class="col-auto d-flex align-items-center">
                <a th:href="@{/admin/news}">
                    <i class="ti ti-arrow-left icon-hover-arrow" style="color: green; font-size: 30px;"></i>
                </a>
            </div>
            <div class="col-auto d-flex align-items-center">
                <h4 class="mb-0 fw-bold" th:text="#{text.exportSupportCenter}"></h4>
            </div>
            <div class="col-1">
                <label class="switch switch-success">
                    <input id="status_" type="checkbox" class="switch-input"/>
                    <span class="switch-toggle-slider">
                        <span class="switch-on"></span>
                        <span class="switch-off"></span>
                    </span>
                </label>
            </div>
        </div>
        <!--/ Header content -->

        <!-- Language tabs -->
        <div class="nav-align-top mb-4">
            <ul class="nav nav-tabs" role="tablist" style="background: none;">
                <li class="nav-item">
                    <button type="button" class="nav-link active" data-bs-toggle="tab"
                            data-bs-target="#navs-ua" aria-controls="navs-ua" aria-selected="true"
                            data-lang="ua">
                        <i class="ti ti-planet me-1"></i>
                        <span>UK</span>
                    </button>
                </li>
                <li class="nav-item">
                    <button type="button" class="nav-link" data-bs-toggle="tab"
                            data-bs-target="#navs-eng" aria-controls="navs-eng" aria-selected="false"
                            data-lang="eng">
                        <i class="ti ti-planet me-1"></i>
                        <span>EN</span>
                    </button>
                </li>
            </ul>
        </div>
        <!--/ Language tabs -->

        <form id="form" th:hx-post="@{/admin/new/save}" enctype="multipart/form-data"
              hx-encoding="multipart/form-data">
            <div class="tab-content p-0 shadow-none" id="pills-tabContent"
                 style="background: transparent;">

                <!-- UA TAB -->
                <div class="tab-pane fade show active" id="navs-ua" role="tabpanel">
                    <div class="row g-4">

                        <div class="col-12 col-xl-4 text-center">
                            <div id="image-block-ua" class="w-100 position-relative"></div>
                        </div>

                        <div class="col-12 col-xl-8">
                            <div class="mb-3">
                                <label class="form-label fw-bold">Заголовок:</label>
                                <input class="form-control" type="text" name="titleUA" data-name="titleUA"
                                       placeholder="..."/>
                            </div>
                            <div class="mb-3" style="overflow: hidden;">
                                <label class="form-label fw-bold">Опис:</label>
                                <div id="description-ua" class="w-100"></div>
                                <input type="hidden" id="hidden-description-ua_" name="descriptionUA">
                            </div>
                        </div>

                        <div class="col-12 col-sm-12 mb-3 text-center">
                            <label class="form-label fw-bold d-block mb-2">
                                Дата публікування:
                            </label>
                            <div id="date-of-publication-block-ua"
                                 class="input-group input-group-merge mx-auto"
                                 style="max-width: 300px;"
                                 data-lang="ua">
                                <input type="text" class="form-control"
                                       data-name="dateOfPublication"
                                       name="dateOfPublication"
                                       data-error="dateOfPublication"
                                       placeholder=""
                                       autocomplete="off"/>
                                        <span class="input-group-text cursor-pointer" onclick="focusInput(this)">
                                            <i class="ti ti-calendar"></i>
                                        </span>
                            </div>
                        </div>
                        <div id="save-block-ua" class="col-12 col-sm-12 mb-3 text-center"></div>
                    </div>
                </div>
                <!--/ UA TAB -->

                <!-- ENG TAB -->
                <div class="tab-pane fade" id="navs-eng" role="tabpanel">
                    <div class="row g-4">

                        <div class="col-12 col-xl-4 text-center">
                            <div id="image-block-eng" class="w-100 position-relative"></div>
                        </div>

                        <div class="col-12 col-xl-8">
                            <div class="mb-3">
                                <label class="form-label fw-bold">Title:</label>
                                <input type="text" class="form-control" name="titleENG" data-name="titleENG"
                                       placeholder="..."/>

                            </div>
                            <div class="mb-3" style="overflow: hidden;">
                                <label class="form-label fw-bold">Description:</label>
                                <div id="description-eng" class="w-100"></div>
                                <input type="hidden" id="hidden-description-eng_" name="descriptionENG">
                            </div>
                        </div>

                        <div class="col-12 col-sm-12 mb-3 text-center">
                            <label class="form-label fw-bold d-block mb-2">
                                Date of publication:
                            </label>
                            <div id="date-of-publication-block-en"
                                 class="input-group input-group-merge mx-auto"
                                 style="max-width: 300px;"
                                 data-lang="ua">
                                <input type="text" class="form-control"
                                       data-name="dateOfPublication"
                                       data-error="dateOfPublication"
                                       placeholder=""
                                       autocomplete="off"/>
                                <span class="input-group-text cursor-pointer" onclick="focusInput(this)">
                                            <i class="ti ti-calendar"></i>
                                        </span>
                            </div>
                        </div>

                        <div id="save-block-eng" class="col-12 text-center mt-4"></div>
                    </div>
                </div>
                <!--/ ENG TAB -->

                <input type="hidden" id="hidden-status_" name="isActive" value="false">
                <input type="file" id="file_" name="file"
                       accept="image/*,video/*" style="display: none;">

                <!-- Image Base -->
                <div id="shared-image" class="shared-image" style="display: none;">
                    <div class="text-center w-100">
                        <div class="position-relative d-inline-block w-100" style="max-width: 400px;">
                            <img id="img_" th:src="@{/image/default-image.jpg}"
                                 class="rounded shadow-sm"
                                 style="width: 100%; height: 300px; object-fit: cover; display: block;">
                            <video id="video_" controls
                                   class="rounded d-none"
                                   style="width: 100%; height: 300px; object-fit: cover;"></video>

                            <div class="d-flex justify-content-center gap-2 mt-2">
                                <button type="button" id="btn-select_" class="btn btn-success btn-sm">
                                    <i class="ti ti-edit"></i> <span>Change</span>
                                </button>
                                <button type="button" id="btn-delete_" class="btn btn-outline-danger btn-sm">
                                    <i class="ti ti-trash"></i> <span>Delete</span>
                                </button>
                            </div>
                        </div>
                        <small class="d-block mt-2 text-muted" th:text="#{text.mediaSize15}"></small>
                    </div>
                </div>
                <!--/ Image Base -->

                <!-- Button save Base -->
                <div id="shared-save" style="display: none;">
                    <button id="btn-save_" type="submit" class="btn btn-success px-5 w-50 w-sm-auto"
                            th:text="#{text.button.save}"></button>
                </div>
                <!--/ Button save Base -->

                <script th:src="@{/js/image.js}"></script>
                <script th:src="@{/js/validator.js}"></script>
                <script th:src="@{/js/copy.js}"></script>
                <script th:src="@{/js/event-listener.js}"></script>


                <script>
                    let isValidFields = true;
                    let url = null;
                    let descriptionUA = document.getElementById("hidden-description-ua_").value;
                    let descriptionEN = document.getElementById("hidden-description-eng_").value;


                    document.querySelectorAll('[data-bs-toggle="tab"]').forEach(tab => {
                        tab.addEventListener('shown.bs.tab', function (event) {
                            const activatedTabId = event.target ? event.target.getAttribute('data-lang') : null;
                            let previousActiveTab = event.relatedTarget ? event.relatedTarget.getAttribute('data-lang') : null;

                            if (previousActiveTab) {
                                copyHTMLBlockImage(`image-block-${previousActiveTab}`, 'shared-image');
                                copyHTMLBlockSave(`save-block-${previousActiveTab}`, 'shared-save');
                            }

                            if (activatedTabId) {
                                copyHTMLBlockImage('shared-image', `image-block-${activatedTabId}`);
                                copyHTMLBlockSave('shared-save', `save-block-${activatedTabId}`);
                            }
                        });
                    });

                    $(document).ready(function () {
                        let activeLang = getActiveLangTab();
                        copyHTMLBlockImage('shared-image', `image-block-${activeLang}`);
                        copyHTMLBlockSave('shared-save', `save-block-${activeLang}`);
                        selectedLanguage();
                        addEventListenerSyncDate();
                        clearErrorWhenChangeValue('[data-name="titleUA"],[data-name="titleENG"]');

                        var editor_ua = getFroalaEditor('description-ua');
                        var editor_eng = getFroalaEditor('description-eng');
                    });

                    function getFroalaEditor(id) {
                        let hiddenSelector = $(`#hidden-${id}_`);
                        const editor = new FroalaEditor(`#${id}`, {
                            theme: current_mode,
                            height: 200,
                            events: {
                                'initialized': function () {
                                    let initialContent = $(hiddenSelector).val() || '';
                                    this.html.set(initialContent);
                                },
                                'contentChanged': function () {
                                    const html = this.html.get();
                                    if(hiddenSelector.length){
                                        hiddenSelector.val(html);
                                    }
                                }
                            }
                        });
                    }

                    function getActiveLangTab() {
                        return document.querySelector('button.nav-link.active').getAttribute('data-lang');
                    }

                    document.querySelector('#status_').addEventListener('change', function () {
                        const statusCheckbox = document.getElementById("status_");
                        const hiddenStatus = document.getElementById("hidden-status_");

                        if (hiddenStatus) {
                            hiddenStatus.value = statusCheckbox.checked ? 'true' : 'false';
                        }
                    });

                    document.body.addEventListener('htmx:confirm', function (event) {
                        if ($('.is-invalid').length > 0) {
                            event.preventDefault();
                        }
                    });
                    document.body.addEventListener('htmx:responseError', function (event) {
                        if (event.detail.xhr.status === 400) {
                            clearValid();
                            let data = JSON.parse(event.detail.xhr.responseText);
                            validate2(data);
                        }
                    });
                </script>
            </div>
        </form>
    </div>
</div>
<!--/ Content -->

</body>
</html>
