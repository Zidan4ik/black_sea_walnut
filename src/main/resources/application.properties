spring.application.name=walnut
#spring.datasource.url=jdbc:mysql://localhost:3306/black_sea_walnut

# Database
spring.datasource.url=${AWS_DB_URL:jdbc:mysql://ack-sea-walnut-db.clgyusi2o1cl.eu-north-1.rds.amazonaws.com:3306/black_sea_walnut?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${AWS_DB_USERNAME:admin}
spring.datasource.password=${AWS_DB_PASSWORD}

server.port=${PORT:8080}
server.address=0.0.0.0
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect
server.forward-headers-strategy=native

upload.path=/app/uploads

spring.servlet.multipart.max-file-size=500MB
spring.servlet.multipart.max-request-size=500MB
server.tomcat.max-swallow-size=500MB
spring.servlet.multipart.enabled=true
server.error.path=/error

# Stripe
stripe.publishable.key=${AWS_STRIPE_PUBLISHABLE_KEY}
stripe.secret.key=${AWS_STRIPE_SECRET_KEY}

#logging.file.name=logs/logs.log
server.servlet.context-path=/Walnut-R.Pravnyk