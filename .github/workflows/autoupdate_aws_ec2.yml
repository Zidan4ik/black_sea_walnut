name: CI/CD Pipeline (No Docker)

on:
  push:
    branches:
      - master

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Build with Maven
        run: mvn clean package -Dmaven.test.skip=true

      - name: Copy JAR to EC2 via SCP
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.AWS_EC2_HOST }}
          username: ${{ secrets.AWS_EC2_USERNAME }}
          key: ${{ secrets.AWS_EC2_SSH_KEY }}
          source: "target/*.jar"
          target: "~/black_sea_walnut"
          strip_components: 1

      - name: Restart Application on EC2 via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.AWS_EC2_HOST }}
          username: ${{ secrets.AWS_EC2_USERNAME }}
          key: ${{ secrets.AWS_EC2_SSH_KEY }}
          script: |
            cd ~/black_sea_walnut
            
            sudo fuser -k 8080/tcp || true
            sleep 3
            
            export AWS_DB_URL="jdbc:mysql://localhost:3306/black_sea_walnut?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC"
            export AWS_DB_USERNAME="${{ secrets.AWS_DB_USERNAME }}"
            export AWS_DB_PASSWORD="${{ secrets.AWS_DB_PASSWORD }}"

            nohup java -jar *.jar > app.log 2>&1 </dev/null &
            sleep 2